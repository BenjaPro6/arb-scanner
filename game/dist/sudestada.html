const glassMat = new THREE.MeshLambertMaterial({ color: 0x161c24 });
const tyreMat = new THREE.MeshLambertMaterial({ color: 0x14161a });
const trimMat = new THREE.MeshLambertMaterial({ color: 0x30343a });
const lampMat = new THREE.MeshBasicMaterial({ color: 0xfff0c0, toneMapped: false });
const redMat = new THREE.MeshBasicMaterial({ color: 0xff2a12, toneMapped: false });

const geoCache = new Map();

// Carrocería a partir de cajas: chasis, capot, baúl y techo.
// El modelo mira hacia +Z, que es el mismo criterio que usa la física.
function bodyGeometry(spec) {
  const key = spec.name;
  if (geoCache.has(key)) return geoCache.get(key);
  const L = spec.L, W = spec.W, H = spec.H;
  const hw = W / 2, hl = L / 2;
  const [r0, r1] = spec.roofBox;          // cabina, en fracción del largo desde atrás
  const zc0 = -hl + L * r0, zc1 = -hl + L * r1;

  const body = new MeshBuilder();   // chapa: va con el color del auto
  const roof = new MeshBuilder();   // techo: color propio (taxi, patrullero)
  const glass = new MeshBuilder();  // vidrios
  const trim = new MeshBuilder();   // paragolpes y zócalos, siempre oscuros

  const sillY = 0.32, beltY = H * 0.60;
  body.box(-hw, -hl, hw, hl, sillY, beltY, 4, 4, 4);
  trim.box(-hw * 0.96, -hl * 0.99, hw * 0.96, hl * 0.99, 0.24, sillY, 4, 4, 4);

  if (spec.class === 'bus') {
    glass.box(-hw * 0.99, zc0, hw * 0.99, zc1, beltY, H * 0.92, 4, 4, 4);
    roof.box(-hw, -hl, hw, hl, H * 0.92, H, 4, 4, 4);
  } else if (spec.class === 'pickup') {
    // Caja de carga atrás, cabina adelante: al revés no es una F100.
    body.box(-hw * 0.97, -hl + L * 0.05, hw * 0.97, zc0, beltY, beltY + 0.34, 4, 4, 4);
    glass.box(-hw * 0.92, zc0, hw * 0.92, zc1, beltY, H - 0.06, 4, 4, 4);
    roof.box(-hw * 0.90, zc0 + 0.06, hw * 0.90, zc1 - 0.06, H - 0.06, H, 4, 4, 4);
  } else {
    glass.box(-hw * 0.91, zc0, hw * 0.91, zc1, beltY, H - 0.06, 4, 4, 4);
    roof.box(-hw * 0.89, zc0 + 0.08, hw * 0.89, zc1 - 0.08, H - 0.06, H, 4, 4, 4);
  }
  // Paragolpes delantero y trasero.
  trim.box(-hw * 0.98, hl - 0.12, hw * 0.98, hl + 0.05, 0.28, 0.60, 4, 4, 4);
  trim.box(-hw * 0.98, -hl - 0.05, hw * 0.98, -hl + 0.12, 0.28, 0.60, 4, 4, 4);

  const out = { body: body.toGeometry(), roof: roof.toGeometry(),
                glass: glass.toGeometry(), trim: trim.toGeometry(), spec };
  geoCache.set(key, out);
  return out;
}

let wheelGeo = null;
function getWheelGeo() {
  if (!wheelGeo) {
    wheelGeo = new THREE.CylinderGeometry(0.34, 0.34, 0.24, 12);
    wheelGeo.rotateZ(Math.PI / 2);
  }
  return wheelGeo;
}

function buildVehicle(spec, color, roofColor) {
  const g = bodyGeometry(spec);
  const root = new THREE.Group();

  const paint = new THREE.MeshLambertMaterial({ color: new THREE.Color(color) });
  // Sin color de techo definido, el techo es del color del auto.
  const roofPaint = (roofColor || spec.roofColor)
    ? new THREE.MeshLambertMaterial({ color: new THREE.Color(roofColor || spec.roofColor) })
    : paint;

  const b = new THREE.Mesh(g.body, paint); b.castShadow = true; root.add(b);
  const rf = new THREE.Mesh(g.roof, roofPaint); rf.castShadow = true; root.add(rf);
  root.add(new THREE.Mesh(g.glass, glassMat));
  root.add(new THREE.Mesh(g.trim, trimMat));

  // Ruedas: se giran para la dirección y ruedan según la velocidad.
  const wr = spec.class === 'bus' ? 0.50 : 0.34;
  const wheels = [];
  const ax = spec.W / 2 - 0.06, az = spec.L * 0.33;
  for (const [sx, sz, steer] of [[-1, 1, true], [1, 1, true], [-1, -1, false], [1, -1, false]]) {
    const w = new THREE.Mesh(getWheelGeo(), tyreMat);
    w.scale.set(1, wr / 0.34, wr / 0.34);
    w.position.set(sx * ax, wr, sz * az);
    w.userData.steer = steer;
    root.add(w); wheels.push(w);
  }

  // Faros y luces de freno
  const hl = spec.L / 2, hw = spec.W / 2;
  const lamps = [], brakes = [];
  for (const sx of [-1, 1]) {
    const l = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.16, 0.06), lampMat);
    l.position.set(sx * hw * 0.66, spec.H * 0.46, hl); root.add(l); lamps.push(l);
    const r = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.14, 0.06), redMat);
    r.position.set(sx * hw * 0.66, spec.H * 0.48, -hl); root.add(r); brakes.push(r);
    r.visible = false;
  }

  let beacon = null;
  if (spec.police) {
    beacon = new THREE.Mesh(
      new THREE.BoxGeometry(spec.W * 0.62, 0.14, 0.20),
      new THREE.MeshBasicMaterial({ color: 0xff2020, toneMapped: false })
    );
    beacon.position.set(0, spec.H + 0.08, spec.L * 0.06);
    root.add(beacon);
  }

  root.userData = { wheels, lamps, brakes, beacon, spec, paint };
  return root;
}

// ===== vehicles/physics.js =====
// Modelo de neumático de dos ejes con ángulo de deriva. Es el que da la
// sensación arcade correcta: el tren trasero se suelta, el auto contradirige
// y con el freno de mano derrapás de verdad.
//
// El auto mira hacia +Z. Adelante f = (sin yaw, cos yaw), derecha r = (-cos yaw, sin yaw).
class Car {
  constructor(spec, x, z, yaw = 0) {
    this.spec = spec;
    this.x = x; this.z = z; this.yaw = yaw;
    this.vx = 0; this.vz = 0; this.yawRate = 0;
    this.steer = 0; this.throttle = 0; this.brake = 0; this.handbrake = false;
    this.damage = 0; this.wheelSpin = 0; this.slip = 0;
    this.a = spec.L * 0.42; this.b = spec.L * 0.42;
    this.Izz = spec.mass * (spec.L * spec.L + spec.W * spec.W) / 12;
    this.cd = spec.power / (spec.topSpeed * spec.topSpeed);   // arrastre coherente con la velocidad máxima
    this.rr = this.cd * 9;
    this.radius = spec.W * 0.52;
    this.alive = true;
  }

  get speed() { return Math.hypot(this.vx, this.vz); }
  get kmh() { return this.speed * 3.6; }

  forward() { return { x: Math.sin(this.yaw), z: Math.cos(this.yaw) }; }
  right() { return { x: -Math.cos(this.yaw), z: Math.sin(this.yaw) }; }

  step(dt) {
    const s = this.spec;
    const f = this.forward(), r = this.right();
    let vLong = this.vx * f.x + this.vz * f.z;
    let vLat = this.vx * r.x + this.vz * r.z;
    const speed = Math.hypot(vLong, vLat);

    // A más velocidad, menos ángulo de volante: si no, es imposible de manejar.
    const steerFade = 1 / (1 + speed * 0.055);
    const delta = this.steer * s.steerMax * steerFade;

    const vRef = Math.max(Math.abs(vLong), 2.2);
    const sgn = vLong >= 0 ? 1 : -1;
    const alphaF = Math.atan((vLat + this.yawRate * this.a) / vRef) - delta * sgn;
    const alphaR = Math.atan((vLat - this.yawRate * this.b) / vRef);

    const g = 9.81;
    const wb = this.a + this.b;
    const loadF = s.mass * g * (this.b / wb);
    const loadR = s.mass * g * (this.a / wb);
    const Cs = 12;                                   // rigidez en curva (rad^-1)
    const muF = s.grip;
    const muR = s.grip * (this.handbrake ? 0.36 : 1.0);

    const Fyf = clamp(-Cs * alphaF * loadF, -muF * loadF, muF * loadF);
    const Fyr = clamp(-Cs * alphaR * loadR, -muR * loadR, muR * loadR);

    // Longitudinal: acelerador, freno, arrastre y rodadura.
    let Flong = 0;
    if (this.throttle > 0) Flong += s.power * this.throttle * (vLong < s.topSpeed ? 1 : 0);
    if (this.throttle < 0) {
      // Freno si voy para adelante, marcha atrás si ya estoy casi parado.
      if (vLong > 0.6) Flong -= s.brake * -this.throttle;
      else Flong += s.power * 0.45 * this.throttle;
    }
    if (this.handbrake) Flong -= Math.sign(vLong) * s.brake * 0.55;
    Flong -= this.cd * vLong * Math.abs(vLong);
    Flong -= this.rr * vLong;

    const accLong = Flong / s.mass + (this.yawRate * vLat);
    const accLat = (Fyf * Math.cos(delta) + Fyr) / s.mass - (this.yawRate * vLong);
    const torque = this.a * Fyf * Math.cos(delta) - this.b * Fyr;

    vLong += accLong * dt;
    vLat += accLat * dt;
    this.yawRate += (torque / this.Izz) * dt;
    this.yawRate *= Math.exp(-dt * (1.4 + 6 / (1 + speed)));   // amortiguación de guiñada

    if (Math.abs(vLong) < 0.25 && this.throttle === 0) { vLong *= 0.80; this.yawRate *= 0.6; }

    this.yaw += this.yawRate * dt;
    this.vx = vLong * f.x + vLat * r.x;
    this.vz = vLong * f.z + vLat * r.z;
    this.x += this.vx * dt;
    this.z += this.vz * dt;

    // Para efectos: humo de goma y ruido de derrape.
    this.slip = clamp((Math.abs(vLat) - 1.5) / 8, 0, 1) * clamp(speed / 6, 0, 1);
    this.wheelSpin += (vLong / 0.34) * dt;
    this.accLong = accLong; this.accLat = accLat;
    this.vLong = vLong; this.vLat = vLat;
  }

  applyImpulse(nx, nz, mag, px, pz) {
    this.vx += nx * mag; this.vz += nz * mag;
    if (px !== undefined) {
      const ox = px - this.x, oz = pz - this.z;
      this.yawRate += (ox * (nz * mag) - oz * (nx * mag)) / this.Izz * this.spec.mass * 0.12;
    }
  }
}

// Tres círculos a lo largo del eje del auto: barato y se porta bien con
// vehículos largos como el bondi.
function collideWorld(car, solids, hash) {
  const f = car.forward();
  const hl = car.spec.L / 2 - car.radius;
  let hit = 0;
  for (const s of [-1, 0, 1]) {
    const px = car.x + f.x * hl * s, pz = car.z + f.z * hl * s;
    for (const box of solids) {
      if (px < box.x0 - car.radius || px > box.x1 + car.radius ||
          pz < box.z0 - car.radius || pz > box.z1 + car.radius) continue;
      const cx = clamp(px, box.x0, box.x1), cz = clamp(pz, box.z0, box.z1);
      let dx = px - cx, dz = pz - cz;
      let d = Math.hypot(dx, dz);
      if (d >= car.radius) continue;
      let nx, nz;
      if (d > 1e-4) { nx = dx / d; nz = dz / d; }
      else {
        // Centro adentro de la caja: empujo por la cara más cercana.
        const dl = px - box.x0, dr = box.x1 - px, dt = pz - box.z0, db = box.z1 - pz;
        const m = Math.min(dl, dr, dt, db);
        nx = m === dl ? -1 : m === dr ? 1 : 0;
        nz = m === dt ? -1 : m === db ? 1 : 0;
        d = 0;
      }
      const pen = car.radius - d;
      car.x += nx * pen; car.z += nz * pen;
      const vn = car.vx * nx + car.vz * nz;
      if (vn < 0) {
        hit = Math.max(hit, -vn);
        car.applyImpulse(nx, nz, -vn * 1.25, px, pz);
        // fricción tangencial contra la pared
        car.vx *= 0.90; car.vz *= 0.90;
        car.yawRate *= 0.72;
      }
    }
  }
  if (hit > 3) car.damage = Math.min(100, car.damage + hit * 1.4);
  return hit;
}

function collideCars(a, b) {
  const dx = b.x - a.x, dz = b.z - a.z;
  const ra = (a.spec.L + a.spec.W) / 4, rb = (b.spec.L + b.spec.W) / 4;
  const min = ra + rb;
  const d2 = dx * dx + dz * dz;
  if (d2 > min * min || d2 < 1e-6) return 0;
  const d = Math.sqrt(d2);
  const nx = dx / d, nz = dz / d, pen = min - d;
  const ma = a.spec.mass, mb = b.spec.mass, mt = ma + mb;
  a.x -= nx * pen * (mb / mt); a.z -= nz * pen * (mb / mt);
  b.x += nx * pen * (ma / mt); b.z += nz * pen * (ma / mt);
  const rel = (b.vx - a.vx) * nx + (b.vz - a.vz) * nz;
  if (rel > 0) return 0;
  const j = -(1.35) * rel / (1 / ma + 1 / mb);
  a.applyImpulse(-nx, -nz, j / ma, (a.x + b.x) / 2, (a.z + b.z) / 2);
  b.applyImpulse(nx, nz, j / mb, (a.x + b.x) / 2, (a.z + b.z) / 2);
  const sev = -rel;
  a.damage = Math.min(100, a.damage + sev * 1.1);
  b.damage = Math.min(100, b.damage + sev * 1.1);
  return sev;
}

// ===== vehicles/traffic.js =====
// El tráfico corre sobre carriles de forma cinemática mientras nadie lo toca:
// así se ve ordenado y no tiembla. Cuando lo chocás pasa a física completa
// ("loose"), sale despedido, y si sobrevive intenta volver a la mano.
class Traffic {
  constructor(scene, city, roads, rng) {
    this.city = city; this.roads = roads; this.rng = rng;
    this.group = new THREE.Group(); scene.add(this.group);
    this.cars = [];
    this.buckets = new Map();
    for (let i = 0; i < CFG.TRAFFIC_CARS; i++) this.cars.push(this.makeSlot());
  }

  makeSlot() {
    return { active: false, mesh: null, car: null, kind: null, mode: 'lane', e: null, dir: 1, lane: 0, s: 0, v: 0, target: 0, wait: 0, looseT: 0, wreck: false, honk: 0 };
  }

  limit(e) { return e.big ? 15.5 : 10.5; }

  spawn(t, px, pz) {
    const rng = this.rng;
    for (let k = 0; k < 14; k++) {
      const ang = rng() * Math.PI * 2;
      const r = rng.range(CFG.SIM_RADIUS * 0.45, CFG.SIM_RADIUS);
      const hit = this.roads.nearestEdge(px + Math.cos(ang) * r, pz + Math.sin(ang) * r);
      if (!hit || this.roads.isBlocked(hit.e)) continue;
      const e = hit.e;
      const kind = pickCivilian(rng);
      const spec = VEHICLES[kind];
      if (spec.class === 'bus' && !e.big) continue;
      const dir = rng.chance(0.5) ? 1 : -1;
      const lane = rng.int(0, e.lanes - 1);
      const s = clamp(hit.t, 0.08, 0.92) * e.len;
      const p = this.roads.lanePos(e, dir, lane, s / e.len);
      if (Math.hypot(p.x - px, p.z - pz) < 45) continue;

      if (!t.mesh || t.kind !== kind) {
        if (t.mesh) this.group.remove(t.mesh);
        const color = spec.colors[rng.int(0, spec.colors.length - 1)];
        t.mesh = buildVehicle(spec, color);
        this.group.add(t.mesh);
        t.kind = kind;
      }
      t.car = new Car(spec, p.x, p.z, this.roads.laneHeading(e, dir));
      t.active = true; t.mode = 'lane'; t.e = e; t.dir = dir; t.lane = lane; t.s = s;
      t.v = this.limit(e) * rng.range(0.7, 1.0); t.wreck = false; t.looseT = 0; t.honk = 0;
      t.mesh.visible = true;
      return true;
    }
    return false;
  }

  key(e, dir, lane) { return e.id * 16 + (dir > 0 ? 8 : 0) + lane; }

  update(dt, world) {
    const { px, pz, obstacles } = world;

    // Índice por carril para saber quién tengo adelante.
    this.buckets.clear();
    for (const t of this.cars) {
      if (!t.active || t.mode !== 'lane') continue;
      const k = this.key(t.e, t.dir, t.lane);
      let b = this.buckets.get(k);
      if (!b) { b = []; this.buckets.set(k, b); }
      b.push(t);
    }

    for (const t of this.cars) {
      if (!t.active) { if (this.rng.chance(0.5)) this.spawn(t, px, pz); continue; }
      const c = t.car;
      const far = Math.hypot(c.x - px, c.z - pz);
      if (far > CFG.DESPAWN_RADIUS && t !== world.conducido) {
        t.active = false; t.mesh.visible = false; continue;
      }

      // El auto que maneja el jugador NO lo toca la IA: su física ya la corrió
      // el Player. Antes stepLane le sobrescribía posición y velocidad desde el
      // carril, así que el acelerador del jugador no hacía nada.
      if (t === world.conducido) { t.v = c.speed; }
      else if (t.mode === 'loose') { this.stepLoose(t, dt, world); }
      else { this.stepLane(t, dt, world, obstacles); }

      const m = t.mesh;
      m.position.set(c.x, 0, c.z);
      m.rotation.y = c.yaw;
      const wd = m.userData;
      for (const w of wd.wheels) {
        w.rotation.x = c.wheelSpin;
        if (w.userData.steer) w.rotation.y = c.steer * 0.4;
      }
      for (const b of wd.brakes) b.visible = t === world.conducido ? c.throttle < 0 : (t.mode === 'lane' && t.decel > 1.2);
    }
  }

  stepLane(t, dt, world, obstacles) {
    const R = this.roads, e = t.e;
    const lim = this.limit(e) * (t.car.spec.class === 'bus' ? 0.78 : 1);
    let target = lim;

    const toEnd = e.len - t.s;
    const node = R.nodes[t.dir > 0 ? e.b : e.a];

    // Semáforo
    if (toEnd < 42 && !R.hasGreen(node, e)) target = Math.min(target, Math.max(0, (toEnd - 8) * 0.34));
    // Bajo un poco antes de cruzar, aunque tenga verde
    if (toEnd < 16) target = Math.min(target, lim * 0.6);

    // Auto adelante en mi mismo carril
    const b = this.buckets.get(this.key(e, t.dir, t.lane));
    if (b) {
      let gap = Infinity, lead = null;
      for (const o of b) {
        if (o === t) continue;
        const d = o.s - t.s;
        if (d > 0 && d < gap) { gap = d; lead = o; }
      }
      if (lead) {
        const clear = gap - (t.car.spec.L / 2 + lead.car.spec.L / 2 + 1.6);
        if (clear < 26) target = Math.min(target, Math.max(0, lead.v * 0.92 + (clear - 7) * 0.5));
      }
    }

    // Cualquier cosa parada adelante (el jugador, un patrullero, un choque)
    const f = { x: Math.sin(t.car.yaw), z: Math.cos(t.car.yaw) };
    for (const o of obstacles) {
      const dx = o.x - t.car.x, dz = o.z - t.car.z;
      const along = dx * f.x + dz * f.z;
      if (along < 0 || along > 24) continue;
      const side = Math.abs(dx * (-f.z) + dz * f.x);
      if (side > 2.6) continue;
      target = Math.min(target, Math.max(0, (along - 6.5) * 0.55));
      if (along < 12 && t.v < 2) t.honk = Math.max(t.honk, 0.8);
    }

    const accel = target > t.v ? 3.6 : 8.5;
    const prev = t.v;
    t.v += clamp(target - t.v, -accel * dt, accel * dt);
    t.v = Math.max(0, t.v);
    t.decel = (prev - t.v) / dt;
    t.honk = Math.max(0, t.honk - dt);

    t.s += t.v * dt;
    if (t.s >= e.len) {
      // Llegué a la esquina: elijo salida sin contramano ni vuelta en U.
      const nodeId = t.dir > 0 ? e.b : e.a;
      const exits = R.exitsFrom(nodeId, e.id);
      if (!exits.length) { t.active = false; t.mesh.visible = false; return; }
      // Preferencia por seguir derecho y por avenidas.
      const h0 = R.laneHeading(e, t.dir);
      let best = null, bestW = -1;
      for (const ex of exits) {
        const h = R.laneHeading(ex.e, ex.dir);
        const turn = Math.abs(angDelta(h0, h));
        let w = (turn < 0.3 ? 3.2 : turn < 1.9 ? 1.0 : 0.15) * (ex.e.big ? 1.5 : 1) * this.rng.range(0.6, 1.4);
        if (w > bestW) { bestW = w; best = ex; }
      }
      t.s -= e.len;
      t.e = best.e; t.dir = best.dir;
      t.lane = Math.min(t.lane, best.e.lanes - 1);
      t.s = Math.min(t.s, best.e.len * 0.5);
    }

    const p = R.lanePos(t.e, t.dir, t.lane, t.s / t.e.len);
    const c = t.car;
    const wantYaw = R.laneHeading(t.e, t.dir);
    c.x = p.x; c.z = p.z;
    c.yaw += angDelta(c.yaw, wantYaw) * Math.min(1, dt * 6);
    c.vx = Math.sin(wantYaw) * t.v; c.vz = Math.cos(wantYaw) * t.v;
    c.wheelSpin += (t.v / 0.34) * dt;
    c.steer = angDelta(c.yaw, wantYaw) * 2;
  }

  stepLoose(t, dt, world) {
    const c = t.car;
    c.throttle = 0; c.steer = 0;
    c.step(dt);
    collideWorld(c, world.solidsNear(c.x, c.z), null);
    t.looseT += dt;
    t.v = c.speed;
    if (t.looseT > 3.5 && c.speed < 1.4) {
      if (c.damage > 55) { t.wreck = true; return; }   // quedó para el desarmadero
      const hit = this.roads.nearestEdge(c.x, c.z);
      if (hit) {
        const e = hit.e;
        // Vuelvo a la mano cuyo rumbo se parezca más al que tengo.
        const d1 = Math.abs(angDelta(c.yaw, this.roads.laneHeading(e, 1)));
        const dir = d1 < Math.PI / 2 ? 1 : -1;
        t.e = e; t.dir = dir; t.lane = 0;
        t.s = clamp(hit.t, 0.05, 0.95) * e.len;
        t.mode = 'lane'; t.v = 0; t.looseT = 0;
      }
    }
  }

  knock(t) {
    if (t.mode === 'lane') { t.mode = 'loose'; t.looseT = 0; }
  }

  active() { return this.cars.filter(t => t.active); }
}

// ===== actors/human.js =====
// Humanoide low-poly con animación 100% procedural: no hay rig ni esqueleto,
// los miembros oscilan por seno y los pies se plantan por fase. A la distancia
// de cámara de un GTA se lee perfecto, y no depende de ningún asset externo.
const SKIN = ['#c99f79', '#8d5a3b', '#e0b894', '#6b432a', '#a97852'];
const SHIRT = ['#3b5a7a', '#7a2f2f', '#3f6b4a', '#2b2b30', '#8a7038', '#5a3a6b', '#b5b0a4'];
const PANTS = ['#2c3038', '#43301f', '#1f3350', '#4a4a44'];

const geo = {
  torso: new THREE.BoxGeometry(0.42, 0.60, 0.24),
  hip: new THREE.BoxGeometry(0.38, 0.20, 0.24),
  head: new THREE.BoxGeometry(0.24, 0.26, 0.24),
  limb: new THREE.BoxGeometry(0.14, 0.42, 0.16),
};
// Los miembros pivotean desde arriba, así que corro la geometría hacia abajo.
geo.limb.translate(0, -0.21, 0);

const matCache = new Map();
const mat = (c) => {
  if (!matCache.has(c)) matCache.set(c, new THREE.MeshLambertMaterial({ color: new THREE.Color(c) }));
  return matCache.get(c);
};

function buildHuman(rng, opts = {}) {
  const skin = opts.skin || rng.pick(SKIN);
  const shirt = opts.shirt || rng.pick(SHIRT);
  const pants = opts.pants || rng.pick(PANTS);
  const scale = opts.scale || rng.range(0.94, 1.06);

  const g = new THREE.Group();
  const torso = new THREE.Mesh(geo.torso, mat(shirt));
  torso.position.y = 1.24; torso.castShadow = true; g.add(torso);
  const hip = new THREE.Mesh(geo.hip, mat(pants));
  hip.position.y = 0.90; g.add(hip);
  const head = new THREE.Mesh(geo.head, mat(skin));
  head.position.y = 1.68; g.add(head);

  const limbs = {};
  for (const [key, x, y, m] of [
    ['armL', -0.28, 1.50, shirt], ['armR', 0.28, 1.50, shirt],
    ['legL', -0.11, 0.90, pants], ['legR', 0.11, 0.90, pants],
  ]) {
    const l = new THREE.Mesh(geo.limb, mat(m));
    l.position.set(x, y, 0);
    g.add(l); limbs[key] = l;
  }
  g.scale.setScalar(scale);
  g.userData = { limbs, torso, head, hip, phase: rng() * 10, scale };
  return g;
}

// speed en m/s. mode: 'walk' | 'run' | 'idle' | 'panic' | 'down'
function animateHuman(h, dt, speed, mode = 'walk') {
  const u = h.userData, L = u.limbs;
  if (mode === 'down') {
    h.rotation.x = Math.min(h.rotation.x + dt * 6, Math.PI / 2);
    u.torso.position.y = 1.24;
    for (const k in L) L[k].rotation.x = 0;
    return;
  }
  h.rotation.x = 0;
  const cadence = mode === 'run' || mode === 'panic' ? 9.5 : 6.4;
  const stride = Math.min(speed / (mode === 'idle' ? 1 : 1.4), 1.5);
  u.phase += dt * cadence * Math.max(0.18, stride);
  const s = Math.sin(u.phase), c = Math.cos(u.phase * 2);
  const amp = 0.62 * stride + (mode === 'idle' ? 0.02 : 0);

  L.legL.rotation.x = s * amp;
  L.legR.rotation.x = -s * amp;
  L.armL.rotation.x = -s * amp * 0.82;
  L.armR.rotation.x = s * amp * 0.82;
  if (mode === 'panic') {
    // Manos a la cabeza: la pose de "me quieren matar".
    L.armL.rotation.x = -2.4 + s * 0.25; L.armR.rotation.x = -2.4 - s * 0.25;
    L.armL.rotation.z = 0.4; L.armR.rotation.z = -0.4;
  } else { L.armL.rotation.z = 0; L.armR.rotation.z = 0; }
  u.torso.position.y = 1.24 + c * 0.028 * stride;
  u.head.position.y = 1.68 + c * 0.030 * stride;
  u.torso.rotation.z = s * 0.045 * stride;
}

// ===== actors/peds.js =====
const OFFSET = 1.4;   // cuánto camina el peatón adentro de la vereda

// Los peatones caminan el perímetro de su manzana. Es barato, se ve natural
// y les da el patrón correcto: doblan en las esquinas y cruzan en la senda.
class Peds {
  constructor(scene, city, rng) {
    this.city = city; this.rng = rng;
    this.list = [];
    this.group = new THREE.Group();
    scene.add(this.group);
    for (let i = 0; i < CFG.PED_COUNT; i++) {
      const mesh = buildHuman(rng);
      mesh.visible = false;
      this.group.add(mesh);
      this.list.push({
        mesh, active: false, state: 'walk', x: 0, z: 0, yaw: 0,
        block: null, side: 0, t: 0, dir: 1, speed: 1.25, timer: 0,
        fear: 0, downTime: 0,
      });
    }
  }

  // Punto del perímetro de la manzana: side 0=norte 1=este 2=sur 3=oeste.
  perimeter(b, side, t, out = {}) {
    const o = OFFSET;
    if (side === 0) { out.x = b.x0 - o + (b.w + o * 2) * t; out.z = b.z0 - o; out.yaw = Math.PI / 2; }
    else if (side === 1) { out.x = b.x1 + o; out.z = b.z0 - o + (b.d + o * 2) * t; out.yaw = 0; }
    else if (side === 2) { out.x = b.x1 + o - (b.w + o * 2) * t; out.z = b.z1 + o; out.yaw = -Math.PI / 2; }
    else { out.x = b.x0 - o; out.z = b.z1 + o - (b.d + o * 2) * t; out.yaw = Math.PI; }
    return out;
  }

  spawnNear(p, px, pz) {
    const rng = this.rng;
    for (let tries = 0; tries < 12; tries++) {
      const ang = rng() * TAU, r = rng.range(70, CFG.SIM_RADIUS * 0.9);
      const b = this.city.blockAt(px + Math.cos(ang) * r, pz + Math.sin(ang) * r);
      if (!b) continue;
      p.block = b; p.side = rng.int(0, 3); p.t = rng(); p.dir = rng.chance(0.5) ? 1 : -1;
      p.speed = rng.range(1.05, 1.55);
      p.state = 'walk'; p.fear = 0; p.downTime = 0; p.active = true;
      p.mesh.visible = true; p.mesh.rotation.x = 0;
      const q = this.perimeter(b, p.side, p.t);
      p.x = q.x; p.z = q.z; p.yaw = q.yaw;
      return true;
    }
    return false;
  }

  // Saca a alguien del auto y lo deja corriendo. Se usa al robar un fierro
  // con el conductor adentro.
  expulsar(x, z) {
    const p = this.list.find(q => !q.active) || this.list[0];
    p.active = true; p.mesh.visible = true; p.mesh.rotation.x = 0;
    p.state = 'flee'; p.fear = 5.5; p.downTime = 0;
    p.x = x; p.z = z; p.yaw = this.rng() * TAU;
    p.block = this.city.blockAt(x, z) || p.block;
    p.side = 0; p.t = 0.5; p.dir = 1; p.speed = 1.3;
    return p;
  }

  update(dt, world) {
    const { px, pz, threats } = world;
    const q = {};
    for (const p of this.list) {
      if (!p.active) {
        if (this.rng.chance(0.25)) this.spawnNear(p, px, pz);
        continue;
      }
      const dist = Math.hypot(p.x - px, p.z - pz);
      if (dist > CFG.DESPAWN_RADIUS && p.state !== 'down') { p.active = false; p.mesh.visible = false; continue; }

      // ¿Hay algo que me quiera pisar?
      let danger = 0, dgx = 0, dgz = 0;
      for (const t of threats) {
        const dx = p.x - t.x, dz = p.z - t.z;
        const d = Math.hypot(dx, dz);
        const menace = t.speed * 0.55 + 4;
        if (d < menace) {
          const w = (menace - d) / menace * clamp(t.speed / 4, 0.3, 3);
          if (w > danger) { danger = w; dgx = dx / (d || 1); dgz = dz / (d || 1); }
        }
      }
      if (danger > 0.25 && p.state !== 'down') { p.state = 'flee'; p.fear = Math.max(p.fear, 2.4); }

      if (p.state === 'down') {
        p.downTime += dt;
        animateHuman(p.mesh, dt, 0, 'down');
        p.mesh.position.set(p.x, 0, p.z);
        if (p.downTime > 22) { p.active = false; p.mesh.visible = false; }
        continue;
      }

      if (p.state === 'flee') {
        p.fear -= dt;
        const sp = 3.4;
        // Corro en dirección contraria al peligro, pegado a la vereda.
        const tx = danger > 0 ? dgx : Math.sin(p.yaw), tz = danger > 0 ? dgz : Math.cos(p.yaw);
        const want = Math.atan2(tx, tz);
        p.yaw += angDelta(p.yaw, want) * Math.min(1, dt * 7);
        p.x += Math.sin(p.yaw) * sp * dt;
        p.z += Math.cos(p.yaw) * sp * dt;
        animateHuman(p.mesh, dt, sp, 'panic');
        if (p.fear <= 0 && danger === 0) {
          const b = this.city.blockAt(p.x, p.z);
          if (b) { p.block = b; p.side = 0; p.t = 0.5; }
          p.state = 'walk';
        }
      } else {
        p.t += (p.speed / (p.side % 2 === 0 ? p.block.w : p.block.d)) * p.dir * dt;
        if (p.t > 1 || p.t < 0) {
          // Esquina: doblo o cruzo a la manzana de enfrente.
          const wrap = p.t > 1;
          p.t = wrap ? 0 : 1;
          if (this.rng.chance(0.25)) {
            const nb = this.city.blockAt(p.block.cx + (this.rng.chance(0.5) ? 1 : -1) * (p.block.w + 30),
                                          p.block.cz + (this.rng.chance(0.5) ? 1 : -1) * (p.block.d + 30));
            if (nb) { p.block = nb; p.side = this.rng.int(0, 3); p.t = this.rng(); }
          } else {
            p.side = (p.side + (wrap ? p.dir : -p.dir) + 4) % 4;
          }
        }
        this.perimeter(p.block, p.side, p.t, q);
        p.x = q.x; p.z = q.z;
        const want = q.yaw + (p.dir > 0 ? 0 : Math.PI);
        p.yaw += angDelta(p.yaw, want) * Math.min(1, dt * 8);
        animateHuman(p.mesh, dt, p.speed, 'walk');
      }
      p.mesh.position.set(p.x, 0, p.z);
      p.mesh.rotation.y = p.yaw;
    }
  }

  // Devuelve cuántos peatones fueron atropellados en este frame.
  runOver(cars) {
    let n = 0;
    for (const p of this.list) {
      if (!p.active || p.state === 'down') continue;
      for (const c of cars) {
        if (c.speed < 2.2) continue;
        const dx = p.x - c.x, dz = p.z - c.z;
        if (dx * dx + dz * dz > (c.spec.L * 0.55) ** 2) continue;
        const f = c.forward();
        const along = dx * f.x + dz * f.z, side = dx * (-f.z) + dz * f.x;
        if (Math.abs(along) < c.spec.L / 2 + 0.3 && Math.abs(side) < c.spec.W / 2 + 0.3) {
          p.state = 'down'; p.downTime = 0; n++;
          p.x += f.x * 1.4; p.z += f.z * 1.4;
          break;
        }
      }
    }
    return n;
  }
}

// ===== actors/player.js =====
// El jugador alterna entre dos modos: a pie y al volante. La cámara y el
// control cambian, la posición es continua — entrar y salir no corta nada.
class Player {
  constructor(scene, rng, startX, startZ) {
    this.mesh = buildHuman(rng, { shirt: '#d8d3c4', pants: '#20242c', scale: 1.0 });
    scene.add(this.mesh);
    this.x = startX; this.z = startZ; this.yaw = 0;
    this.vx = 0; this.vz = 0;
    this.mode = 'foot';
    this.vehicle = null;        // slot de tráfico o auto propio
    this.car = null;            // instancia de Car cuando manejo
    this.enterCooldown = 0;
    this.health = 100;
    this.armor = 0;
    // Pistola en la mano derecha: sólo se ve cuando estás armado.
    this.gun = new THREE.Mesh(
      new THREE.BoxGeometry(0.08, 0.13, 0.26),
      new THREE.MeshLambertMaterial({ color: 0x22252b })
    );
    this.gun.position.set(0.30, 1.06, 0.16);
    this.gun.visible = false;
    this.mesh.add(this.gun);

    this.camYaw = 0; this.camPitch = 0.44; this.camDist = 8; this.camZoom = 1; this.lookIdle = 0;
    this.shake = 0;
  }

  get pos() { return this.mode === 'drive' ? { x: this.car.x, z: this.car.z } : { x: this.x, z: this.z }; }

  // Temporizadores que corren en los dos modos. Sin esto, enterCooldown se
  // quedaba en 0.4 para siempre y nunca más podías bajarte del auto.
  tick(dt) {
    this.enterCooldown = Math.max(0, this.enterCooldown - dt);
  }

  // El chaleco se come el daño primero; lo que sobra va a la salud.
  danar(n) {
    if (this.armor > 0) {
      const absorbe = Math.min(this.armor, n * 0.75);
      this.armor -= absorbe; n -= absorbe;
    }
    this.health -= n;
  }
  get speed() { return this.mode === 'drive' ? this.car.speed : Math.hypot(this.vx, this.vz); }

  updateFoot(dt, input, camAngle, solids) {
    const ax = input.axisX(), ay = input.axisY();
    const sprint = input.is('sprint');
    const maxV = sprint ? 5.6 : 2.4;
    let want = 0, has = false;
    if (ax || ay) {
      // Relativo a la cámara: W va hacia donde mirás, A y D caminan de costado.
      // El eje X va negado porque la derecha de la cámara es (-cos, sin).
      want = Math.atan2(-ax, ay) + camAngle;
      has = true;
    }
    const accel = 22;
    if (has) {
      const tx = Math.sin(want) * maxV, tz = Math.cos(want) * maxV;
      this.vx += clamp(tx - this.vx, -accel * dt, accel * dt);
      this.vz += clamp(tz - this.vz, -accel * dt, accel * dt);
      this.yaw += angDelta(this.yaw, Math.atan2(this.vx, this.vz)) * Math.min(1, dt * 12);
    } else {
      this.vx *= Math.exp(-dt * 12); this.vz *= Math.exp(-dt * 12);
    }
    this.x += this.vx * dt; this.z += this.vz * dt;

    // Colisión contra los edificios: círculo de 0.4m.
    for (const b of solids) {
      if (this.x < b.x0 - 0.4 || this.x > b.x1 + 0.4 || this.z < b.z0 - 0.4 || this.z > b.z1 + 0.4) continue;
      const cx = clamp(this.x, b.x0, b.x1), cz = clamp(this.z, b.z0, b.z1);
      let dx = this.x - cx, dz = this.z - cz, d = Math.hypot(dx, dz);
      if (d >= 0.4) continue;
      if (d < 1e-4) {
        const dl = this.x - b.x0, dr = b.x1 - this.x, dtp = this.z - b.z0, db = b.z1 - this.z;
        const m = Math.min(dl, dr, dtp, db);
        dx = m === dl ? -1 : m === dr ? 1 : 0; dz = m === dtp ? -1 : m === db ? 1 : 0; d = 1;
      }
      this.x += (dx / d) * (0.4 - d); this.z += (dz / d) * (0.4 - d);
    }

    const sp = Math.hypot(this.vx, this.vz);
    animateHuman(this.mesh, dt, sp, sp > 3.2 ? 'run' : sp > 0.15 ? 'walk' : 'idle');
    this.mesh.position.set(this.x, 0, this.z);
    this.mesh.rotation.y = this.yaw;
    this.mesh.visible = true;
  }

  updateDrive(dt, input, solids) {
    const c = this.car;
    c.throttle = input.axisY();
    c.steer = -input.axisX();
    c.handbrake = input.is('handbrake');
    c.step(dt);
    const hit = collideWorld(c, solids, null);
    if (hit > 6) { this.health -= (hit - 6) * 1.4; this.shake = Math.max(this.shake, clamp(hit / 14, 0, 1)); }
    this.x = c.x; this.z = c.z; this.yaw = c.yaw;
    this.mesh.visible = false;
  }

  enter(slot, car) {
    this.mode = 'drive'; this.vehicle = slot; this.car = car;
    this.enterCooldown = 0.4;
  }

  exit() {
    const c = this.car;
    const r = c.right();
    this.x = c.x - r.x * (c.spec.W / 2 + 0.8);
    this.z = c.z - r.z * (c.spec.W / 2 + 0.8);
    this.yaw = c.yaw;
    this.vx = 0; this.vz = 0;
    this.mode = 'foot'; this.vehicle = null; this.car = null;
    this.enterCooldown = 0.4;
  }

  // Cámara en órbita, movida con el mouse. Antes seguía sola al personaje y
  // el personaje seguía a la cámara: esa realimentación era la que te hacía
  // girar 360 grados solo al caminar.
  updateCamera(camera, dt, input) {
    const p = this.pos;
    const m = input.consumeMouse ? input.consumeMouse() : { dx: 0, dy: 0, wheel: 0 };

    const sens = 0.0024;
    if (m.dx || m.dy) {
      this.camYaw -= m.dx * sens;
      this.camPitch = clamp(this.camPitch + m.dy * sens, -0.42, 1.05);
      this.lookIdle = 0;
    } else {
      this.lookIdle = (this.lookIdle || 0) + dt;
    }
    if (input.is && input.is('camleft')) { this.camYaw += dt * 2.0; this.lookIdle = 0; }
    if (input.is && input.is('camright')) { this.camYaw -= dt * 2.0; this.lookIdle = 0; }
    if (m.wheel) this.camZoom = clamp((this.camZoom || 1) + m.wheel * 0.12, 0.6, 2.0);

    const driving = this.mode === 'drive';
    // Manejando, si soltás el mouse la cámara vuelve sola atrás del auto.
    if (driving && this.lookIdle > 1.1) {
      const k = Math.min(1, dt * 2.2);
      this.camYaw += angDelta(this.camYaw, this.car.yaw) * k;
      this.camPitch += (0.44 - this.camPitch) * k;
    }

    const v = driving ? this.car.speed : 0;
    const dist = (driving
      ? lerp(8.8, 13.2, clamp(v / 34, 0, 1)) * (this.car.spec.L / 4.6)
      : 5.0) * (this.camZoom || 1);
    this.camDist = lerp(this.camDist, dist, Math.min(1, dt * 4));

    const ty = driving ? 1.25 : 1.35;
    const cp = Math.cos(this.camPitch), sp = Math.sin(this.camPitch);
    let sh = 0;
    if (this.shake > 0) { sh = this.shake; this.shake = Math.max(0, this.shake - dt * 2.2); }

    camera.position.set(
      p.x - Math.sin(this.camYaw) * this.camDist * cp + (Math.random() - 0.5) * sh * 1.2,
      Math.max(0.9, ty + this.camDist * sp) + (Math.random() - 0.5) * sh * 0.8,
      p.z - Math.cos(this.camYaw) * this.camDist * cp + (Math.random() - 0.5) * sh * 1.2
    );
    camera.lookAt(p.x, ty, p.z);
  }

}

// ===== systems/economy.js =====
// El sistema que ningún GTA tiene: la guita se derrite mientras la tenés.
//
// priceIndex sube exponencialmente en tiempo real. Los pagos de las misiones
// están indexados, así que nominalmente cobrás cada vez más — pero si dejás
// los pesos quietos en el bolsillo, tu poder adquisitivo cae solo.
// La salida es el dólar: corrés a una cueva y comprás. Pero para llegar a la
// cueva tenés que manejar, y manejar con estrellas encima es otro problema.
class Economy {
  constructor(rng) {
    this.rng = rng;
    this.pesos = 45000;
    this.usd = 0;
    this.priceIndex = 1;
    this.blueNoise = 0;
    this.rate = Math.log(1 + CFG.INFLATION_PER_MIN) / 60;   // por segundo
    this.propiedades = [];      // negocios comprados
    this.rentaAcum = 0;
    this.peakReal = this.realWealth;
  }

  get blue() {
    return CFG.BLUE_BASE * this.priceIndex * (1 + this.blueNoise);
  }
  // Riqueza medida en pesos del día uno. Es el único número que importa.
  get realWealth() { return this.pesos / this.priceIndex + this.usd * CFG.BLUE_BASE; }
  get power() { return this.pesos / this.priceIndex; }

  // Renta total por minuto, en pesos de hoy.
  get rentaReal() { return this.propiedades.reduce((a, p) => a + p.renta, 0); }

  comprar(negocio) {
    if (negocio.dueno) return 'ya es tuyo';
    if (!this.charge(negocio.precio)) return 'sin plata';
    negocio.dueno = true;
    this.propiedades.push({ nombre: negocio.nombre, renta: negocio.renta });
    return 'comprado';
  }

  update(dt) {
    this.priceIndex *= Math.exp(this.rate * dt);
    // La renta también viene indexada: los negocios ajustan precios.
    if (this.propiedades.length) this.pay(this.rentaReal * (dt / 60));
    // Camino aleatorio con reversión a la media para el blue.
    this.blueNoise += (this.rng() - 0.5) * CFG.BLUE_VOL * dt * 2 - this.blueNoise * 0.25 * dt;
    this.blueNoise = Math.max(-0.18, Math.min(0.28, this.blueNoise));
    this.peakReal = Math.max(this.peakReal, this.realWealth);
  }

  // La cueva se queda con la diferencia, como corresponde.
  buyUsd(pesosIn) {
    const rate = this.blue * 1.025;
    const amount = Math.min(pesosIn, this.pesos);
    if (amount < 1) return 0;
    const got = amount / rate;
    this.pesos -= amount; this.usd += got;
    return got;
  }
  sellUsd(usdIn) {
    const rate = this.blue * 0.975;
    const amount = Math.min(usdIn, this.usd);
    if (amount < 0.01) return 0;
    const got = amount * rate;
    this.usd -= amount; this.pesos += got;
    return got;
  }

  // Los pagos vienen indexados: 20.000 "de hoy" valen más nominalmente mañana.
  pay(realAmount) {
    const nominal = realAmount * this.priceIndex;
    this.pesos += nominal;
    return nominal;
  }
  guardar() {
    return { pesos: this.pesos, usd: this.usd, priceIndex: this.priceIndex,
             propiedades: this.propiedades };
  }
  cargar(d) {
    if (!d) return;
    this.pesos = d.pesos ?? this.pesos;
    this.usd = d.usd ?? this.usd;
    this.priceIndex = d.priceIndex ?? this.priceIndex;
    this.propiedades = d.propiedades || [];
  }

  charge(realAmount) {
    const nominal = realAmount * this.priceIndex;
    if (this.pesos < nominal) return false;
    this.pesos -= nominal;
    return true;
  }
}

// ===== systems/places.js =====
// Puntos de interés del mapa: cuevas para cambiar, talleres para sacarse la
// cana de encima, y el punto de laburo.
const TYPES = {
  cueva:  { color: 0x35d07f, label: 'Cueva', r: 3.4 },
  taller: { color: 0x3aa0ff, label: 'Taller', r: 4.2 },
  laburo: { color: 0xffb020, label: 'Laburo', r: 4.6 },
  armeria:{ color: 0xc0392b, label: 'Armería', r: 3.6 },
  kiosco: { color: 0xf0e14a, label: 'Kiosco', r: 3.2 },
  negocio:{ color: 0xb06cff, label: 'Negocio', r: 4.0 },
  meta:   { color: 0xff5470, label: 'Destino', r: 4.0 },
};

class Places {
  constructor(scene, city, rng) {
    this.city = city; this.rng = rng;
    this.group = new THREE.Group(); scene.add(this.group);
    this.list = [];

    // Las cuevas viven en la City y en Once, como en la vida real.
    for (let i = 0; i < 6; i++)
      this.add('cueva', city.randomBlock(b => b.district === 'microcentro' || b.district === 'once'));
    for (let i = 0; i < 5; i++)
      this.add('taller', city.randomBlock(b => b.kind === 'edificado'));
    // El laburo arranca al lado del jugador. Antes caía en una manzana al azar
    // de 676 en 3,2 km² y no había forma humana de encontrarlo.
    const cerca = city.blockAt(city.center.x + 60, city.center.z + 110)
      || city.randomBlock(b => b.kind === 'edificado');
    this.laburo = this.add('laburo', cerca);
    for (let i = 0; i < 3; i++)
      this.add('armeria', city.randomBlock(b => b.district === 'once' || b.district === 'boca'));
    this.armeriaCerca = this.add('armeria',
      city.blockAt(city.center.x - 130, city.center.z + 60) || city.randomBlock(b => b.kind === 'edificado'));

    // Kioscos por toda la ciudad: comida, chaleco, y algo para afanar.
    for (let i = 0; i < 10; i++) this.add('kiosco', city.randomBlock(b => b.kind === 'edificado'));
    this.add('kiosco', city.blockAt(city.center.x + 130, city.center.z - 40) || city.randomBlock(b => b.kind === 'edificado'));

    // Negocios en venta. Cada uno rinde una renta por minuto, indexada.
    const rubros = [
      ['Parrilla', 220000, 5200], ['Kiosco 24hs', 150000, 3600], ['Taller mecánico', 320000, 7400],
      ['Bar de Palermo', 480000, 10800], ['Playa de estacionamiento', 260000, 6100],
      ['Cueva de la City', 900000, 21000], ['Remisería', 380000, 8700], ['Cancha de paddle', 300000, 6800],
    ];
    this.negocios = [];
    for (const [nombre, precio, renta] of rubros) {
      const pl = this.add('negocio', city.randomBlock(b => b.kind === 'edificado'));
      pl.nombre = nombre; pl.precio = precio; pl.renta = renta; pl.dueno = false;
      this.negocios.push(pl);
    }
  }

  add(type, block, x, z) {
    const t = TYPES[type];
    const pos = this.streetSpot(block, x, z);
    const mesh = new THREE.Mesh(
      new THREE.CylinderGeometry(t.r, t.r, 7, 20, 1, true),
      new THREE.MeshBasicMaterial({ color: t.color, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false, toneMapped: false })
    );
    mesh.position.set(pos.x, 3.5, pos.z);
    this.group.add(mesh);
    const p = { type, x: pos.x, z: pos.z, r: t.r, mesh, label: t.label, color: t.color };
    this.list.push(p);
    return p;
  }

  // Lo pongo sobre la calle, pegado al cordón de la manzana.
  streetSpot(block, x, z) {
    if (x !== undefined) return { x, z };
    const side = this.rng.int(0, 3);
    const o = 5.5;
    if (side === 0) return { x: block.cx, z: block.z0 - o };
    if (side === 1) return { x: block.x1 + o, z: block.cz };
    if (side === 2) return { x: block.cx, z: block.z1 + o };
    return { x: block.x0 - o, z: block.cz };
  }

  move(place, x, z) { place.x = x; place.z = z; place.mesh.position.set(x, 3.5, z); }
  show(place, on) { place.mesh.visible = on; }

  near(x, z, type) {
    for (const p of this.list) {
      if (type && p.type !== type) continue;
      if (!p.mesh.visible) continue;
      if (Math.hypot(p.x - x, p.z - z) < p.r + 2.5) return p;
    }
    return null;
  }

  update(dt) {
    for (const p of this.list) p.mesh.rotation.y += dt * 0.6;
  }
}

// ===== systems/weapons.js =====
// Arsenal con tiro hitscan. Cada arma define daño, cadencia, dispersión,
// alcance y cuántos proyectiles salen por disparo: la escopeta tira seis
// perdigones abiertos, el subfusil uno solo pero muy rápido.
const ARMAS = {
  pistola:  { nombre: 'Pistola',  dano: 34, cadencia: 0.26,  cargador: 12, disp: 0.030, alcance: 70, precio: 26000,  bala: 380, perdigones: 1, auto: false },
  escopeta: { nombre: 'Escopeta', dano: 17, cadencia: 0.85,  cargador: 6,  disp: 0.115, alcance: 26, precio: 78000,  bala: 900, perdigones: 6, auto: false },
  uzi:      { nombre: 'Subfusil', dano: 18, cadencia: 0.085, cargador: 30, disp: 0.055, alcance: 55, precio: 145000, bala: 520, perdigones: 1, auto: true },
};
const ORDEN_ARMAS = ['pistola', 'escopeta', 'uzi'];

class Weapons {
  constructor(scene, game) {
    this.g = game;
    this.inv = {};   // arma -> { balas, cargador }
    this.actual = null;
    this.cool = 0;

    this.trazas = [];
    for (let i = 0; i < 20; i++) {
      const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
      const l = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xffd489, transparent: true, opacity: 0.9 }));
      l.visible = false; scene.add(l);
      this.trazas.push({ l, t: 0 });
    }
    this.fogonazo = new THREE.Mesh(
      new THREE.SphereGeometry(0.24, 6, 5),
      new THREE.MeshBasicMaterial({ color: 0xffe6a0, transparent: true, opacity: 0.95, toneMapped: false })
    );
    this.fogonazo.visible = false; scene.add(this.fogonazo);
    this.flashT = 0;
  }

  get spec() { return this.actual ? ARMAS[this.actual] : null; }
  get armado() { return !!this.actual; }
  get enCargador() { return this.actual ? this.inv[this.actual].cargador : 0; }
  get balas() { return this.actual ? this.inv[this.actual].balas : 0; }
  tiene(k) { return !!this.inv[k]; }

  elegir(k) {
    if (!this.inv[k]) return false;
    this.actual = k; this.cool = Math.max(this.cool, 0.2);
    return true;
  }
  siguiente() {
    const tengo = ORDEN_ARMAS.filter(k => this.inv[k]);
    if (!tengo.length) return;
    const i = tengo.indexOf(this.actual);
    this.elegir(tengo[(i + 1) % tengo.length]);
  }

  comprar(k, economia) {
    const s = ARMAS[k];
    if (!s) return 'no hay';
    if (!this.inv[k]) {
      if (!economia.charge(s.precio)) return 'sin plata';
      this.inv[k] = { balas: s.cargador, cargador: s.cargador };
      this.actual = k;
      return 'comprada';
    }
    const lote = s.cargador * 2;
    if (!economia.charge(s.bala * lote)) return 'sin plata';
    this.inv[k].balas += lote;
    return 'municion';
  }

  // Munición total del arma en mano, para el HUD.
  get municionTotal() { return this.enCargador + this.balas; }

  bloqueado(x0, z0, x1, z1, solidsNear) {
    const pasos = 16;
    for (let i = 1; i <= pasos; i++) {
      const t = i / pasos;
      const x = x0 + (x1 - x0) * t, z = z0 + (z1 - z0) * t;
      for (const b of solidsNear(x, z))
        if (x > b.x0 && x < b.x1 && z > b.z0 && z < b.z1) return true;
    }
    return false;
  }

  disparar(dt, mantenido) {
    const g = this.g, p = g.player;
    this.cool = Math.max(0, this.cool - dt);
    if (!this.actual || p.mode !== 'foot') return null;
    const s = this.spec;
    if (mantenido && !s.auto && this.yaDisparo) return null;
    if (this.cool > 0) return null;

    const car = this.inv[this.actual];
    if (car.cargador <= 0) {
      if (car.balas <= 0) return 'sin balas';
      const carga = Math.min(s.cargador, car.balas);
      car.cargador = carga; car.balas -= carga; this.cool = 1.2;
      return 'recargando';
    }
    car.cargador--; this.cool = s.cadencia; this.yaDisparo = true;
    p.yaw = p.camYaw;

    const ox = p.x + Math.sin(p.camYaw) * 0.4, oz = p.z + Math.cos(p.camYaw) * 0.4, oy = 1.35;
    let impacto = null, bajas = 0;

    for (let n = 0; n < s.perdigones; n++) {
      const ang = p.camYaw + (n === 0 ? 0 : (Math.random() - 0.5) * s.disp * 2);
      const dx = Math.sin(ang), dz = Math.cos(ang);
      const cono = Math.cos(s.disp + 0.02);
      let mejor = null, mejorD = s.alcance;
      const mirar = (tx, tz, obj, tipo) => {
        const vx = tx - ox, vz = tz - oz, d = Math.hypot(vx, vz);
        if (d < 0.8 || d > s.alcance) return;
        if ((vx / d) * dx + (vz / d) * dz < cono) return;
        if (d < mejorD) { mejorD = d; mejor = { obj, tipo, x: tx, z: tz }; }
      };
      for (const ped of g.peds.list) if (ped.active && ped.state !== 'down') mirar(ped.x, ped.z, ped, 'peaton');
      for (const u of g.police.units) if (u.active) mirar(u.car.x, u.car.z, u, 'cana');
      for (const t of g.traffic.cars) if (t.active && t !== p.vehicle) mirar(t.car.x, t.car.z, t, 'auto');
      if (mejor && this.bloqueado(ox, oz, mejor.x, mejor.z, g.solidsNear)) mejor = null;

      const fin = mejor ? mejor : { x: ox + dx * s.alcance, z: oz + dz * s.alcance };
      this.traza(ox, oy, oz, fin.x, mejor ? 1.1 : 1.5, fin.z);
      if (!mejor) continue;
      impacto = impacto || mejor.tipo;

      if (mejor.tipo === 'peaton') {
        mejor.obj.state = 'down'; mejor.obj.downTime = 0; bajas++;
      } else if (mejor.tipo === 'cana') {
        mejor.obj.vida = (mejor.obj.vida ?? 100) - s.dano;
        if (mejor.obj.vida <= 0) { g.police.retire(mejor.obj); bajas++; g.police.crime('chocarPatrullero', 1.4); }
        else g.police.crime('chocarPatrullero', 0.16);
      } else {
        mejor.obj.car.damage = Math.min(100, mejor.obj.car.damage + s.dano * 0.4);
        g.traffic.knock(mejor.obj);
      }
    }

    if (bajas > 0 && impacto === 'peaton') g.police.crime('atropello', 1.4 * bajas);
    this.fogonazo.position.set(ox + Math.sin(p.camYaw) * 0.5, oy, oz + Math.cos(p.camYaw) * 0.5);
    this.fogonazo.visible = true; this.flashT = 0.05;
    g.audio.bang(this.actual === 'escopeta' ? 12 : 7);
    return impacto || 'tiro';
  }

  soltar() { this.yaDisparo = false; }

  update(dt) {
    this.flashT -= dt;
    if (this.flashT <= 0) this.fogonazo.visible = false;
    for (const tr of this.trazas) {
      if (!tr.l.visible) continue;
      tr.t -= dt;
      tr.l.material.opacity = clamp(tr.t / 0.09, 0, 1) * 0.9;
      if (tr.t <= 0) tr.l.visible = false;
    }
  }

  traza(x0, y0, z0, x1, y1, z1) {
    const tr = this.trazas.find(t => !t.l.visible) || this.trazas[0];
    const pos = tr.l.geometry.attributes.position;
    pos.setXYZ(0, x0, y0, z0); pos.setXYZ(1, x1, y1, z1);
    pos.needsUpdate = true;
    tr.l.geometry.computeBoundingSphere();
    tr.l.visible = true; tr.t = 0.09;
  }

  guardar() { return { inv: this.inv, actual: this.actual }; }
  cargar(d) {
    if (!d || !d.inv) return;
    this.inv = d.inv;
    this.actual = d.actual && this.inv[d.actual] ? d.actual : (Object.keys(this.inv)[0] || null);
  }
}

// ===== systems/missions.js =====
// Misiones como máquina de estados. Cada una define arranque, chequeo por
// frame y cierre. La plata siempre se paga indexada por la Economy.
const POOL = [
  {
    id: 'reparto', title: 'Reparto',
    brief: (m) => `Llevá el paquete a destino. Tenés ${Math.ceil(m.limit)} segundos.`,
    setup(m, g) {
      m.limit = 95; m.reward = 22000;
      const b = g.city.randomBlock(b => b.kind === 'edificado' && Math.hypot(b.cx - g.player.pos.x, b.cz - g.player.pos.z) > 500);
      const s = g.places.streetSpot(b);
      g.places.move(g.meta, s.x, s.z); g.places.show(g.meta, true);
      m.needCar = true;
    },
    tick(m, g, dt) {
      m.limit -= dt;
      if (m.limit <= 0) return 'fail';
      const p = g.player.pos;
      if (Math.hypot(p.x - g.meta.x, p.z - g.meta.z) < g.meta.r + 3 && g.player.mode === 'drive') return 'win';
      return null;
    },
    hud: (m) => `Destino  ·  ${m.limit.toFixed(0)}s`,
  },
  {
    id: 'chorro', title: 'Afanar un fierro',
    brief: (m) => `Conseguí un ${VEHICLES[m.want].name} y metelo en el taller.`,
    setup(m, g) {
      m.want = g.rng.pick(['falcon', 'r12', 'taxi', 'pickup', 'deportivo']);
      m.reward = 34000; m.limit = 210; m.stage = 0;
      const t = g.rng.pick(g.places.list.filter(p => p.type === 'taller'));
      m.taller = t;
      g.places.show(g.meta, false);
    },
    tick(m, g, dt) {
      m.limit -= dt;
      if (m.limit <= 0) return 'fail';
      if (m.stage === 0) {
        if (g.player.mode === 'drive' && g.player.car.spec.name === VEHICLES[m.want].name) {
          m.stage = 1;
          g.places.move(g.meta, m.taller.x, m.taller.z); g.places.show(g.meta, true);
        }
      } else {
        if (g.player.mode !== 'drive' || g.player.car.spec.name !== VEHICLES[m.want].name) { m.stage = 0; g.places.show(g.meta, false); return null; }
        const p = g.player.pos;
        if (Math.hypot(p.x - m.taller.x, p.z - m.taller.z) < m.taller.r + 3) return 'win';
      }
      return null;
    },
    hud: (m) => m.stage === 0
      ? `Buscá un ${VEHICLES[m.want].name}  ·  ${m.limit.toFixed(0)}s`
      : `Al taller  ·  ${m.limit.toFixed(0)}s`,
  },
  {
    id: 'aguantar', title: 'Aguantar la cana',
    brief: () => 'Te marcaron. Bancá la persecución sin que te agarren.',
    setup(m, g) {
      m.limit = 80; m.reward = 48000;
      g.police.heat = Math.max(g.police.heat, 3);
      g.places.show(g.meta, false);
    },
    tick(m, g, dt) {
      m.limit -= dt;
      if (g.police.busted > 1.6) return 'fail';
      if (m.limit <= 0) return 'win';
      return null;
    },
    hud: (m) => `Aguantá  ·  ${m.limit.toFixed(0)}s`,
  },
  {
    id: 'mandado', title: 'Mandado a la cueva',
    brief: () => 'Te dieron pesos. Cambialos a dólares antes de que se derritan.',
    setup(m, g) {
      m.limit = 110; m.reward = 0;
      m.given = g.economy.pay(60000);
      m.realAtStart = 60000;
      const c = g.rng.pick(g.places.list.filter(p => p.type === 'cueva'));
      m.cueva = c;
      g.places.move(g.meta, c.x, c.z); g.places.show(g.meta, true);
    },
    tick(m, g, dt) {
      m.limit -= dt;
      if (m.limit <= 0) return 'fail';
      const p = g.player.pos;
      if (Math.hypot(p.x - m.cueva.x, p.z - m.cueva.z) < m.cueva.r + 3) {
        g.economy.buyUsd(m.given);
        m.kept = g.economy.power;
        return 'win';
      }
      return null;
    },
    hud: (m) => `A la cueva  ·  ${m.limit.toFixed(0)}s`,
  },
];

class Missions {
  constructor(game) {
    this.g = game;
    this.current = null;
    this.cooldown = 0;
    this.done = 0; this.failed = 0;
    this.toast = ''; this.toastT = 0;
  }

  say(text, secs = 4) { this.toast = text; this.toastT = secs; }

  offer() {
    if (this.current || this.cooldown > 0) return;
    const def = this.g.rng.pick(POOL);
    const m = { def, started: 0 };
    def.setup(m, this.g);
    this.current = m;
    this.say(`${def.title}. ${def.brief(m)}`, 6);
  }

  update(dt) {
    this.toastT = Math.max(0, this.toastT - dt);
    this.cooldown = Math.max(0, this.cooldown - dt);
    const m = this.current;
    if (!m) {
      // Entrar al marcador de laburo ofrece una changa nueva.
      const p = this.g.player.pos;
      const l = this.g.places.laburo;
      if (Math.hypot(p.x - l.x, p.z - l.z) < l.r + 2.5) this.offer();
      return;
    }
    m.started += dt;
    const r = m.def.tick(m, this.g, dt);
    if (r === 'win') {
      const nominal = m.def.id === 'mandado' ? 0 : this.g.economy.pay(m.reward);
      this.done++;
      this.say(m.def.id === 'mandado'
        ? 'Cambiaste a tiempo. Los verdes no se derriten.'
        : `Listo. Cobraste ${Math.round(nominal).toLocaleString('es-AR')} pesos.`, 5);
      this.finish();
    } else if (r === 'fail') {
      this.failed++;
      this.say('Se te fue al carajo. Volvé al laburo cuando quieras.', 4);
      this.finish();
    }
  }

  finish() {
    this.g.places.show(this.g.meta, false);
    this.current = null;
    this.cooldown = 6;
  }

  hudLine() {
    if (!this.current) return null;
    return `${this.current.def.title}  —  ${this.current.def.hud(this.current)}`;
  }
}

// ===== systems/police.js =====
const CRIME = {
  atropello: 0.95,
  robo: 0.60,
  chocarPatrullero: 0.85,
  choque: 0.10,
  contramano: 0.02,
};

// Cinco estrellas. La Federal patrulla el centro y persigue prolijo;
// la Bonaerense aparece de tres estrellas para arriba y te va a chocar.
class Police {
  constructor(scene, city, roads, rng) {
    this.city = city; this.roads = roads; this.rng = rng;
    this.group = new THREE.Group(); scene.add(this.group);
    this.units = [];
    this.heat = 0;
    this.unseen = 0;
    this.blinker = 0;
    this.busted = 0;
    this.disparos = [];   // tiros de la cana pendientes de resolver este frame
  }

  crime(kind, mult = 1) {
    const v = (CRIME[kind] || 0.1) * mult;
    this.heat = Math.min(CFG.WANTED_MAX, this.heat + v);
    this.unseen = 0;
  }

  get stars() { return Math.ceil(this.heat - 1e-6); }

  wanted() { return Math.max(0, Math.min(CFG.WANTED_MAX, Math.ceil(this.heat - 1e-6))); }

  clear() { this.heat = 0; this.unseen = 0; for (const u of this.units) this.retire(u); }

  desiredUnits() {
    const s = this.wanted();
    return [0, 1, 2, 4, 6, 8][s] || 0;
  }

  retire(u) { u.active = false; if (u.mesh) u.mesh.visible = false; }

  spawn(px, pz, aggressive) {
    const rng = this.rng;
    const kind = aggressive && rng.chance(0.55) ? 'bonaerense' : 'patrullero';
    const spec = VEHICLES[kind];
    for (let k = 0; k < 16; k++) {
      const ang = rng() * Math.PI * 2, r = rng.range(120, 240);
      const hit = this.roads.nearestEdge(px + Math.cos(ang) * r, pz + Math.sin(ang) * r);
      if (!hit) continue;
      const dir = rng.chance(0.5) ? 1 : -1;
      const p = this.roads.lanePos(hit.e, dir, 0, clamp(hit.t, 0.1, 0.9));
      if (Math.hypot(p.x - px, p.z - pz) < 90) continue;
      let u = this.units.find(x => !x.active && x.kind === kind);
      if (!u) {
        u = { kind, mesh: buildVehicle(spec, spec.colors[0]), active: false, path: null, pi: 0, repath: 0, siren: 0 };
        this.group.add(u.mesh);
        this.units.push(u);
      }
      u.car = new Car(spec, p.x, p.z, this.roads.laneHeading(hit.e, dir));
      u.vida = 100; u.tiro = this.rng.range(0.4, 1.6);
      u.active = true; u.mesh.visible = true; u.path = null; u.repath = 0;
      u.force = kind === 'bonaerense' ? 'bonaerense' : 'federal';
      return u;
    }
    return null;
  }

  update(dt, world) {
    const { px, pz, playerCar, playerSpeed, solidsNear } = world;
    this.blinker += dt;
    this.disparos.length = 0;

    // Enfriamiento: si nadie te ve, la estrella baja sola.
    let seen = false;
    for (const u of this.units) {
      if (!u.active) continue;
      if (Math.hypot(u.car.x - px, u.car.z - pz) < 95) seen = true;
    }
    if (!seen && this.heat > 0) {
      this.unseen += dt;
      if (this.unseen > CFG.HIDE_TIME) this.heat = Math.max(0, this.heat - CFG.HEAT_DECAY * dt * (1 + this.heat * 0.4));
    } else if (seen) this.unseen = 0;

    const want = this.desiredUnits();
    let live = 0;
    for (const u of this.units) if (u.active) live++;
    if (live < want && this.rng.chance(0.6)) this.spawn(px, pz, this.wanted() >= 3);
    if (live > want) {
      for (const u of this.units) {
        if (!u.active) continue;
        if (Math.hypot(u.car.x - px, u.car.z - pz) > 220) { this.retire(u); break; }
      }
    }

    for (const u of this.units) {
      if (!u.active) continue;
      const c = u.car;
      const d = Math.hypot(px - c.x, pz - c.z);
      if (d > 520) { this.retire(u); continue; }

      // Objetivo: lejos sigo el grafo de calles, cerca voy directo con adelanto.
      let tx = px, tz = pz;
      if (d > 55) {
        u.repath -= dt;
        if (!u.path || u.repath <= 0) {
          const from = this.roads.nodeNear(c.x, c.z), to = this.roads.nodeNear(px, pz);
          u.path = this.roads.path(from, to); u.pi = 0; u.repath = 1.6;
        }
        if (u.path && u.path.length) {
          while (u.pi < u.path.length - 1) {
            const n = this.roads.nodes[u.path[u.pi]];
            if (Math.hypot(n.x - c.x, n.z - c.z) < 16) u.pi++; else break;
          }
          const n = this.roads.nodes[u.path[Math.min(u.pi, u.path.length - 1)]];
          tx = n.x; tz = n.z;
        }
      } else if (playerCar) {
        const lead = this.wanted() >= 3 ? 0.55 : 0.25;
        tx = px + playerCar.vx * lead; tz = pz + playerCar.vz * lead;
      }

      const want2 = Math.atan2(tx - c.x, tz - c.z);
      const err = angDelta(c.yaw, want2);
      // Un volante positivo hace crecer el yaw, así que el error va con su signo.
      c.steer = clamp(err * 1.9, -1, 1);

      const aggro = u.force === 'bonaerense' ? 1.15 : 1.0;
      const cruise = clamp(c.spec.topSpeed * aggro, 10, 60);
      // Freno para las curvas: si estoy muy cruzado y rápido, levanto.
      const turnBrake = clamp(1 - Math.abs(err) * 0.9, -1, 1);
      let thr = c.speed > cruise ? -0.3 : turnBrake;
      if (d < 9 && this.wanted() >= 3) thr = 1;            // embestida
      if (d < 6 && this.wanted() < 3) thr = -1;            // corte de ruta
      c.throttle = clamp(thr, -1, 1);
      c.handbrake = Math.abs(err) > 1.5 && c.speed > 14;

      c.step(dt);
      collideWorld(c, solidsNear(c.x, c.z), null);

      const m = u.mesh;
      m.position.set(c.x, 0, c.z);
      m.rotation.y = c.yaw;
      for (const w of m.userData.wheels) {
        w.rotation.x = c.wheelSpin;
        if (w.userData.steer) w.rotation.y = c.steer * 0.4;
      }
      if (m.userData.beacon) {
        const on = (this.blinker * 6) % 2 < 1;
        m.userData.beacon.material.color.setHex(on ? 0xff2020 : 0x2040ff);
      }

      // Te arrestan si estás quieto y te tienen encima: a pie o con el auto
      // parado. Antes sólo contaba a pie, así que arriba del auto nunca
      // pasaba nada por más que te rodearan.
      const quieto = playerSpeed < (playerCar ? 3.5 : 2);
      if (d < (playerCar ? 7 : 4.8) && quieto && c.speed < 4) this.busted += dt;

      // De dos estrellas para arriba te tiran si estás a pie y cerca.
      if (!playerCar && this.wanted() >= 2 && d < 34) {
        u.tiro -= dt;
        if (u.tiro <= 0) {
          u.tiro = this.rng.range(0.7, 1.8);
          this.disparos.push({ x: c.x, z: c.z, tx: px, tz: pz, dano: this.rng.range(5, 11) });
        }
      }
    }
    if (!this.units.some(u => u.active && Math.hypot(u.car.x - px, u.car.z - pz) < (world.playerCar ? 8 : 6)))
      this.busted = 0;
  }

  activeCars() { return this.units.filter(u => u.active).map(u => u.car); }
}

// Guardado en el navegador. Se autoguarda cada tanto y al cerrar la pestaña.
// Todo va envuelto en try/catch: en ventana privada localStorage puede tirar.
const CLAVE = 'sudestada.v1';

class Save {
  constructor(game) { this.g = game; this.t = 0; }

  instantanea() {
    const g = this.g, p = g.player.pos;
    return {
      v: 1,
      economia: g.economy.guardar(),
      armas: g.weapons.guardar(),
      salud: g.player.health, chaleco: g.player.armor,
      x: p.x, z: p.z, hora: g.hour,
      stats: g.stats,
      misiones: { hechas: g.missions.done, falladas: g.missions.failed },
      negocios: g.places.negocios.filter(n => n.dueno).map(n => n.nombre),
    };
  }

  guardar() {
    try { localStorage.setItem(CLAVE, JSON.stringify(this.instantanea())); return true; }
    catch (_) { return false; }
  }

  hay() {
    try { return !!localStorage.getItem(CLAVE); } catch (_) { return false; }
  }

  cargar() {
    let d;
    try { d = JSON.parse(localStorage.getItem(CLAVE) || 'null'); } catch (_) { return false; }
    if (!d || d.v !== 1) return false;
    const g = this.g;
    g.economy.cargar(d.economia);
    g.weapons.cargar(d.armas);
    g.player.health = d.salud ?? 100;
    g.player.armor = d.chaleco ?? 0;
    g.hour = d.hora ?? g.hour;
    g.stats = d.stats || g.stats;
    g.missions.done = d.misiones?.hechas || 0;
    g.missions.failed = d.misiones?.falladas || 0;
    for (const n of g.places.negocios)
      if ((d.negocios || []).includes(n.nombre)) { n.dueno = true; n.mesh.material.color.setHex(0x35d07f); }
    if (typeof d.x === 'number') {
      g.player.x = d.x; g.player.z = d.z;
      g.ownCar.car.x = d.x + 6; g.ownCar.car.z = d.z;
    }
    return true;
  }

  borrar() { try { localStorage.removeItem(CLAVE); } catch (_) {} }

  update(dt) {
    this.t += dt;
    if (this.t > 20) { this.t = 0; this.guardar(); }
  }
}

  update(g) {

    this.el('v-pesos').textContent = pesos(e.pesos);
