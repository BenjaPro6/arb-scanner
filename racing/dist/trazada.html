<title>Trazada</title>
<style>

<div id="splash">
  <h1>TRAZADA</h1>
  <p>Simulador de circuito con física de neumático real. Volante o teclado.</p>
  <div class="barra"><i></i></div>
  <div id="carga">Arrancando…</div>
</div>
<div id="foco" class="oculto">
  <b>Hacé clic para manejar</b>
  <span>W A S D con teclado. Si tenés volante conectado, apretá <b>C</b> y movelo de tope a tope y pisá los pedales para calibrarlo.</span>
</div>

<script type="module">
let THREE;
try { THREE = await import('https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js'); }
catch (e) { THREE = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'); }

// ===== core/utils.js =====
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, t, dt) => a + (b - a) * (1 - Math.pow(1 - t, dt * 60));
const TAU = Math.PI * 2;

// Diferencia angular más corta, en (-PI, PI].
function angDelta(from, to) {
  let d = (to - from) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d <= -Math.PI) d += TAU;
  return d;
}

function approach(cur, target, rate, dt) {
  const d = target - cur;
  const step = rate * dt;
  return Math.abs(d) <= step ? target : cur + Math.sign(d) * step;
}

// Formato de guita al estilo argentino: $1.234.567
function pesos(n) {
  const s = Math.round(Math.abs(n)).toString();
  return (n < 0 ? '-$' : '$') + s.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

// Hash espacial simple para consultas de vecindad O(1).
class SpatialHash {
  constructor(cell = 40) { this.cell = cell; this.map = new Map(); }
  key(x, z) { return ((x / this.cell) | 0) * 73856093 ^ ((z / this.cell) | 0) * 19349663; }
  clear() { this.map.clear(); }
  insert(x, z, item) {
    const k = this.key(x, z);
    let b = this.map.get(k);
    if (!b) { b = []; this.map.set(k, b); }
    b.push(item);
  }
  query(x, z, r, out = []) {
    out.length = 0;
    const c = this.cell, n = Math.ceil(r / c);
    for (let dx = -n; dx <= n; dx++) for (let dz = -n; dz <= n; dz++) {
      const b = this.map.get(this.key(x + dx * c, z + dz * c));
      if (b) for (const it of b) out.push(it);
    }
    return out;
  }
}

// ===== core/rng.js =====
// PRNG determinista (mulberry32). Misma semilla => misma ciudad, siempre.
function makeRng(seed) {
  let a = seed >>> 0;
  const r = () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.range = (lo, hi) => lo + r() * (hi - lo);
  r.int = (lo, hi) => Math.floor(r.range(lo, hi + 1));
  r.pick = (arr) => arr[Math.floor(r() * arr.length)];
  r.chance = (p) => r() < p;
  return r;
}

// ===== core/meshbuilder.js =====
// Constructor de geometría cruda. Escribo los vértices a mano en vez de
// mergear BoxGeometry porque necesito control exacto de las UV: los ventanales
// tienen que medir siempre lo mismo en metros, sin importar el tamaño del edificio.
class MeshBuilder {
  constructor() { this.pos = []; this.nor = []; this.uv = []; }

  get count() { return this.pos.length / 3; }

  quad(ax, ay, az, bx, by, bz, cx, cy, cz, dx, dy, dz, u, v) {
    const e1x = bx - ax, e1y = by - ay, e1z = bz - az;
    const e2x = dx - ax, e2y = dy - ay, e2z = dz - az;
    let nx = e1y * e2z - e1z * e2y, ny = e1z * e2x - e1x * e2z, nz = e1x * e2y - e1y * e2x;
    const l = Math.hypot(nx, ny, nz) || 1; nx /= l; ny /= l; nz /= l;
    const P = this.pos, N = this.nor, U = this.uv;
    const push = (x, y, z, s, t) => { P.push(x, y, z); N.push(nx, ny, nz); U.push(s, t); };
    push(ax, ay, az, 0, 0); push(bx, by, bz, u, 0); push(cx, cy, cz, u, v);
    push(ax, ay, az, 0, 0); push(cx, cy, cz, u, v); push(dx, dy, dz, 0, v);
  }

  // Caja apoyada en y0, con UV en "unidades de textura" reales (metros / escala).
  box(x0, z0, x1, z1, y0, y1, us, vs, capUs = us) {
    const w = x1 - x0, d = z1 - z0, h = y1 - y0;
    const uw = w / us, ud = d / us, vh = h / vs;
    // Cuatro caras laterales, cada una con la normal apuntando hacia AFUERA.
    // norte (-z)
    this.quad(x1, y0, z0, x0, y0, z0, x0, y1, z0, x1, y1, z0, uw, vh);
    // sur (+z)
    this.quad(x0, y0, z1, x1, y0, z1, x1, y1, z1, x0, y1, z1, uw, vh);
    // oeste (-x)
    this.quad(x0, y0, z0, x0, y0, z1, x0, y1, z1, x0, y1, z0, ud, vh);
    // este (+x)
    this.quad(x1, y0, z1, x1, y0, z0, x1, y1, z0, x1, y1, z1, ud, vh);
    // techo
    this.quad(x0, y1, z1, x1, y1, z1, x1, y1, z0, x0, y1, z0, w / capUs, d / capUs);
  }

  // Losa horizontal (vereda, plaza, cancha).
  slab(x0, z0, x1, z1, y, us = 8) {
    this.quad(x0, y, z1, x1, y, z1, x1, y, z0, x0, y, z0, (x1 - x0) / us, (z1 - z0) / us);
  }

  toGeometry() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.nor, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uv, 2));
    g.computeBoundingSphere();
    return g;
  }
}

// ===== sim/tire.js =====
// Modelo de neumático tipo Pacejka (fórmula mágica). La diferencia con el
// modelo lineal del GTA es que ESTE TIENE PICO: la fuerza crece con la deriva
// hasta un máximo y después CAE. Ese pico y esa caída son exactamente lo que
// sentís en las manos cuando el auto se te va, y lo que un volante con force
// feedback tiene que transmitir. Sin esto, un juego de volante no existe.
//
//   F = D · sin( C · atan( B·s − E·(B·s − atan(B·s)) ) )
//
// D es el pico (μ·Fz), C la forma, B la rigidez y E la asimetría de la caída.

// B, C y E resueltos para que el pico caiga donde cae en un neumático real.
// Ojo: los coeficientes que se publican suelen estar en GRADOS; acá todo va en
// radianes, y confundirlo deja la curva sin pico (sube y nunca cae).
const LATERAL = { B: 10.14, C: 1.9, E: 0.6, pico: 0.1309 };    // pico a 7,5° de deriva
const LONGITUDINAL = { B: 15.96, C: 1.65, E: 0.5, pico: 0.11 }; // pico a 11% de deslizamiento

function magica(s, p) {
  const bs = p.B * s;
  return Math.sin(p.C * Math.atan(bs - p.E * (bs - Math.atan(bs))));
}

// Fuerza lateral pura. alpha en radianes, Fz en newtons.
function lateral(alpha, Fz, mu) {
  return -mu * Fz * magica(alpha, LATERAL);
}

// Fuerza longitudinal pura. kappa es el deslizamiento (adimensional).
function longitudinal(kappa, Fz, mu) {
  return mu * Fz * magica(kappa, LONGITUDINAL);
}

// Elipse de fricción: acelerar y doblar comparten el mismo agarre. Si pedís
// las dos cosas al mismo tiempo, las dos bajan. Es lo que hace que frenar y
// girar juntos te mande de trompa afuera.
function combinado(alpha, kappa, Fz, mu) {
  if (Fz <= 0) return { fx: 0, fy: 0, uso: 0 };
  // Se normaliza cada deslizamiento contra su propio pico y se combinan: el
  // agarre es uno solo y se reparte entre doblar y traccionar.
  const sa = alpha / LATERAL.pico;
  const sk = kappa / LONGITUDINAL.pico;
  const s = Math.hypot(sa, sk);
  if (s < 1e-7) return { fx: 0, fy: 0, uso: 0 };
  const total = mu * Fz * magica(s * LATERAL.pico, LATERAL);
  return {
    fx: (sk / s) * total,
    fy: -(sa / s) * total,
    uso: s,                       // 1 = justo en el límite de agarre
  };
}

// La carga no da agarre lineal: al doblar el peso, el agarre sube menos del
// doble. Por eso transferir peso a una rueda cuesta agarre total, y por eso
// una barra estabilizadora dura de un lado hace que ese eje pierda antes.
function muEfectivo(muNominal, Fz, FzNominal = 4000) {
  if (Fz <= 0) return 0;
  return muNominal * Math.pow(FzNominal / Math.max(Fz, 200), 0.11);
}

const T = { LATERAL, LONGITUDINAL, lateral, longitudinal, combinado, muEfectivo };

// ===== sim/vehicle.js =====
// Auto de simulación, no arcade. Seis grados de libertad:
//   plano  -> avance, lateral y guiñada
//   masa suspendida -> hundimiento, cabeceo y balanceo
// Más la velocidad de giro de cada rueda, que es lo que permite patinar en
// aceleración y bloquear en frenada.
//
// La transferencia de peso NO es una fórmula instantánea: sale de la dinámica
// de resortes y amortiguadores. Por eso el auto tarda en apoyarse al entrar a
// una curva, y por eso se puede desestabilizar levantando de golpe.
//
// Ejes locales: adelante = (sin yaw, cos yaw); derecha = (-cos yaw, sin yaw).

const TC = {
  nombre: 'TC 2000',
  masa: 1180, masaSusp: 1010,
  a: 1.28, b: 1.34,            // distancia del centro de gravedad a cada eje
  vias: 1.56, h: 0.46,         // trocha y altura del centro de gravedad
  Izz: 1620, Ipitch: 1500, Iroll: 480,
  kF: 52000, kR: 48000,        // resortes por rueda (N/m)
  cF: 4600, cR: 4300,          // amortiguadores (Ns/m)
  arbF: 19500, arbR: 12500,    // barra delantera más dura: el auto avisa antes de irse
  rueda: 0.315, Iw: 1.3, Imotor: 0.19, mu: 1.38,
  parMax: 340, rpmPar: 5200, rpmCorte: 7000, rpmRalenti: 900,
  marchas: [3.36, 2.14, 1.58, 1.24, 1.00, 0.84], final: 3.62,
  traccion: 'trasera',
  frenoMax: 4200, repFreno: 0.63,
  arrastre: 0.72,              // N por (m/s)^2
  cargaAero: 0.85,             // downforce por (m/s)^2
  volanteMax: 0.52,            // radianes de giro de rueda a tope de volante
};

const ORDEN = ['DI', 'DD', 'TI', 'TD'];   // delantera izq/der, trasera izq/der

class Vehicle {
  constructor(spec = TC, x = 0, z = 0, yaw = 0) {
    this.s = spec;
    this.x = x; this.z = z; this.yaw = yaw;
    this.u = 0; this.v = 0; this.r = 0;          // avance, lateral, guiñada
    this.zs = 0; this.dzs = 0;                   // hundimiento
    this.pitch = 0; this.dpitch = 0;
    this.roll = 0; this.droll = 0;
    this.marcha = 1; this.rpm = spec.rpmRalenti;
    this.cambio = 0;

    // Geometría de cada rueda en ejes locales: [longitudinal, lateral]
    this.pos = {
      DI: [+spec.a, -spec.vias / 2], DD: [+spec.a, +spec.vias / 2],
      TI: [-spec.b, -spec.vias / 2], TD: [-spec.b, +spec.vias / 2],
    };
    // Carga estática: el eje delantero soporta según el reparto de pesos.
    const g = 9.81, L = spec.a + spec.b;
    const Ff = spec.masa * g * (spec.b / L) / 2;
    const Fr = spec.masa * g * (spec.a / L) / 2;
    this.estatico = { DI: Ff, DD: Ff, TI: Fr, TD: Fr };
    this.w = { DI: 0, DD: 0, TI: 0, TD: 0 };       // velocidad angular de rueda
    this.Fz = { ...this.estatico };
    this.slipL = { DI: 0, DD: 0, TI: 0, TD: 0 };   // deriva
    this.slipK = { DI: 0, DD: 0, TI: 0, TD: 0 };   // deslizamiento
    this.uso = { DI: 0, DD: 0, TI: 0, TD: 0 };     // 1 = al límite

    this.mandos = { acelerador: 0, freno: 0, volante: 0, mano: false, embrague: 0 };
    this.ffb = 0;             // par de autoalineación: la señal para el volante
    this.aLong = 0; this.aLat = 0;
  }

  get velocidad() { return Math.hypot(this.u, this.v); }
  get kmh() { return this.velocidad * 3.6; }
  adelante() { return { x: Math.sin(this.yaw), z: Math.cos(this.yaw) }; }
  derecha() { return { x: -Math.cos(this.yaw), z: Math.sin(this.yaw) }; }

  parMotor(rpm) {
    const s = this.s;
    if (rpm > s.rpmCorte) return 0;
    // Curva simple con pico y caída, más un valle abajo de vueltas.
    const x = (rpm - s.rpmPar) / (s.rpmPar * 0.95);
    const f = clamp(1 - x * x * 0.72, 0.18, 1);
    const arranque = clamp(rpm / 1400, 0.25, 1);
    return s.parMax * f * arranque;
  }

  relacion() { return this.s.marchas[this.marcha - 1] * this.s.final; }

  // Caja automática sencilla: sube cerca del corte, baja cuando cae de vueltas.
  cambiar(dt) {
    this.cambio = Math.max(0, this.cambio - dt);
    if (this.cambio > 0) return;
    const s = this.s;
    if (this.rpm > s.rpmCorte * 0.96 && this.marcha < s.marchas.length) { this.marcha++; this.cambio = 0.18; }
    else if (this.rpm < 2600 && this.marcha > 1) { this.marcha--; this.cambio = 0.18; }
  }

  paso(dt) {
    if (this.rpmReal === undefined) this.rpmReal = this.s.rpmRalenti;
    const s = this.s, g = 9.81;
    const m = this.mandos;
    const vel = this.velocidad;

    // --- Cargas verticales por rueda (dinámica de suspensión) ---
    const zc = {}, dzc = {};
    for (const k of ORDEN) {
      const [lo, la] = this.pos[k];
      zc[k] = this.zs + lo * this.pitch - la * this.roll;
      dzc[k] = this.dzs + lo * this.dpitch - la * this.droll;
    }
    const kOf = (k) => k[0] === 'D' ? s.kF : s.kR;
    const cOf = (k) => k[0] === 'D' ? s.cF : s.cR;
    const dF = {};
    for (const k of ORDEN) dF[k] = -kOf(k) * zc[k] - cOf(k) * dzc[k];
    // Barras estabilizadoras: reparten el balanceo entre ejes.
    const arb = (izq, der, kb) => {
      const t = kb * (zc[izq] - zc[der]);
      dF[izq] -= t; dF[der] += t;
    };
    arb('DI', 'DD', s.arbF); arb('TI', 'TD', s.arbR);

    for (const k of ORDEN) this.Fz[k] = Math.max(0, this.estatico[k] + dF[k]
      + s.cargaAero * vel * vel / 4);

    // --- Fuerzas de neumático ---
    const delta = m.volante * s.volanteMax;
    let Fx = 0, Fy = 0, Mz = 0, alineacion = 0;
    const parFreno = m.freno * s.frenoMax;
    const motriz = this.parMotriz(dt);

    for (const k of ORDEN) {
      const [lo, la] = this.pos[k];
      // Velocidad en el punto de contacto. El signo de lo·r es el que da el
      // amortiguamiento de guiñada: con el contrario, un auto que empieza a
      // girar se realimenta y hace trompo con cualquier entrada. Verificado
      // con la prueba de escalón de volante.
      const uW = this.u - this.r * la;
      const vW = this.v + this.r * lo;
      const frente = k[0] === 'D';
      const dir = frente ? delta : 0;

      // Deriva y deslizamiento en ejes de la rueda.
      const uR = uW * Math.cos(dir) + vW * Math.sin(dir);
      const vR = -uW * Math.sin(dir) + vW * Math.cos(dir);
      const ref = Math.max(Math.abs(uR), 1.6);
      const alpha = Math.atan2(vR, ref);
      const kappa = (this.w[k] * s.rueda - uR) / ref;
      this.slipL[k] = alpha; this.slipK[k] = kappa;

      const mu = T.muEfectivo(s.mu, this.Fz[k]);
      const f = T.combinado(alpha, kappa, this.Fz[k], mu);
      this.uso[k] = f.uso;

      // Dinámica de la rueda: el par del motor y el freno contra el suelo.
      const motrizK = motriz[k] || 0;
      const frenoK = parFreno * (frente ? s.repFreno : 1 - s.repFreno) / 2
        * (m.mano && !frente ? 2.2 : 1);
      const parSuelo = f.fx * s.rueda;
      const motriz_k = motrizK !== 0 || (s.traccion === 'trasera' ? !frente : true);
      const rel = this.relacion();
      const Ief = s.Iw + (motriz_k ? s.Imotor * rel * rel / 2 : 0);
      const frenoAplicado = Math.sign(this.w[k]) * Math.min(frenoK, Math.abs(this.w[k]) * Ief / dt + Math.abs(parSuelo));
      const dw = (motrizK - parSuelo - frenoAplicado) / Ief;
      this.w[k] += dw * dt;
      if (Math.abs(this.w[k]) < 0.4 && frenoK > 0) this.w[k] = 0;

      // De ejes de rueda a ejes del auto.
      const fx = f.fx * Math.cos(dir) - f.fy * Math.sin(dir);
      const fy = f.fx * Math.sin(dir) + f.fy * Math.cos(dir);
      Fx += fx; Fy += fy;
      Mz += fy * lo - fx * la;
      // El par de autoalineación de las delanteras ES la señal de force
      // feedback: el avance del neumático por la fuerza lateral.
      if (frente) alineacion += f.fy * 0.028;
    }

    Fx -= s.arrastre * this.u * Math.abs(this.u);
    Fy -= 0.6 * this.v * Math.abs(this.v);

    this.aLong = Fx / s.masa;
    this.aLat = Fy / s.masa;
    this.ffb = clamp(alineacion / 330, -1, 1);

    // --- Integración del plano ---
    this.u += (this.aLong + this.r * this.v) * dt;
    this.v += (this.aLat - this.r * this.u) * dt;
    this.r += (Mz / s.Izz) * dt;
    this.r *= Math.exp(-dt * 0.35);

    const f2 = this.adelante(), d2 = this.derecha();
    this.x += (this.u * f2.x + this.v * d2.x) * dt;
    this.z += (this.u * f2.z + this.v * d2.z) * dt;
    this.yaw += this.r * dt;

    // --- Integración de la masa suspendida ---
    const ms = s.masaSusp;
    let sumF = 0, momP = 0, momR = 0;
    for (const k of ORDEN) {
      const [lo, la] = this.pos[k];
      sumF += dF[k]; momP += dF[k] * lo; momR -= dF[k] * la;
    }
    this.dzs += (sumF / ms) * dt;
    this.dpitch += ((momP + ms * this.aLong * s.h) / s.Ipitch) * dt;
    // El signo del término inercial del balanceo: verificado con un invariante
    // geométrico (la rueda de AFUERA de la curva tiene que cargar más), no por
    // razonamiento sobre convenciones.
    this.droll += ((momR + ms * this.aLat * s.h) / s.Iroll) * dt;
    this.zs += this.dzs * dt;
    this.pitch += this.dpitch * dt;
    this.roll += this.droll * dt;

    // --- Motor ---
    const wMotriz = s.traccion === 'trasera' ? (this.w.TI + this.w.TD) / 2
      : s.traccion === 'delantera' ? (this.w.DI + this.w.DD) / 2
      : (this.w.DI + this.w.DD + this.w.TI + this.w.TD) / 4;
    // Se guarda el régimen REAL: recortarlo antes del limitador hacía que el
    // corte no actuara nunca y el motor siguiera empujando sin techo.
    this.rpmReal = Math.abs(wMotriz) * this.relacion() * 60 / (2 * Math.PI);
    this.rpm = clamp(this.rpmReal, s.rpmRalenti, s.rpmCorte);
    this.cambiar(dt);
  }

  // Par que llega a cada rueda motriz.
  parMotriz(dt) {
    const s = this.s, m = this.mandos;
    if (this.cambio > 0 || m.acelerador <= 0) return {};
    if (this.rpmReal > s.rpmCorte) return {};        // limitador
    const par = this.parMotor(this.rpm) * m.acelerador * this.relacion() * 0.92;
    if (s.traccion === 'trasera') return { TI: par / 2, TD: par / 2 };
    if (s.traccion === 'delantera') return { DI: par / 2, DD: par / 2 };
    return { DI: par / 4, DD: par / 4, TI: par / 4, TD: par / 4 };
  }
}

function costoMejora(clave, nivelActual) {
  const m = MEJORAS[clave];
  if (!m || nivelActual >= m.max) return null;
  return Math.round(m.base * Math.pow(1.62, nivelActual));
}

function aplicarMejoras(base, mejoras = {}) {
  const s = { ...base };
  const n = (k) => mejoras[k] || 0;
  s.parMax = base.parMax * (1 + n('motor') * 0.075);
  s.mu = base.mu * (1 + n('gomas') * 0.042);
  const sus = 1 + n('suspension') * 0.14;
  s.kF = base.kF * sus; s.kR = base.kR * sus;
  s.arbF = base.arbF * sus; s.arbR = base.arbR * sus;
  s.cF = base.cF * (1 + n('suspension') * 0.09);
  s.cR = base.cR * (1 + n('suspension') * 0.09);
  s.frenoMax = base.frenoMax * (1 + n('frenos') * 0.10);
  s.cargaAero = base.cargaAero * (1 + n('aero') * 0.30);
  s.arrastre = base.arrastre * (1 + n('aero') * 0.04);
  const quita = 1 - n('peso') * 0.045;
  s.masa = base.masa * quita; s.masaSusp = base.masaSusp * quita;
  s.Izz = base.Izz * quita;
  return s;
}

// Puntaje de rendimiento, para emparejar rivales y ordenar el garage.
function indice(spec) {
  const potencia = spec.parMax / spec.masa * 1000;
  const agarre = spec.mu * 100 + spec.cargaAero * 12;
  const freno = spec.frenoMax / spec.masa * 10;
  return Math.round(potencia * 1.15 + agarre + freno);
}

// ===== track/spline.js =====
// Curva cerrada Catmull-Rom remuestreada por longitud de arco. Que esté
// parametrizada por METROS y no por el parámetro de la curva es lo que hace
// que después funcionen los tiempos por vuelta, los sectores, la traza de la
// IA y saber si estás dentro o fuera de la pista.
class Spline {
  constructor(puntos, muestras = 12) {
    this.p = puntos;
    this.tabla = [];
    let acum = 0;
    const n = puntos.length;
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < muestras; j++) {
        const t = j / muestras;
        const a = this.crom(i, t);
        const b = this.crom(i, t + 1 / muestras);
        const d = Math.hypot(b.x - a.x, b.z - a.z);
        this.tabla.push({ s: acum, i, t, x: a.x, z: a.z });
        acum += d;
      }
    }
    this.largo = acum;
    // Tangente y normal en cada muestra, ya normalizadas.
    for (let k = 0; k < this.tabla.length; k++) {
      const a = this.tabla[k], b = this.tabla[(k + 1) % this.tabla.length];
      let dx = b.x - a.x, dz = b.z - a.z;
      const l = Math.hypot(dx, dz) || 1;
      a.tx = dx / l; a.tz = dz / l;
      a.nx = -a.tz; a.nz = a.tx;         // normal a la izquierda de la marcha
    }
    for (let k = 0; k < this.tabla.length; k++) {
      const a = this.tabla[k], b = this.tabla[(k + 1) % this.tabla.length];
      // Curvatura: cuánto gira la tangente por metro. La IA la usa para frenar.
      const cross = a.tx * b.tz - a.tz * b.tx;
      const ds = Math.max(0.5, (b.s - a.s + this.largo) % this.largo);
      a.curv = cross / ds;
    }
  }

  // Índice de tabla para una distancia dada, por búsqueda binaria.
  indiceDe(s) {
    const largo = this.largo;
    s = ((s % largo) + largo) % largo;
    const T = this.tabla;
    let lo = 0, hi = T.length - 1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (T[m].s <= s) lo = m; else hi = m - 1; }
    return lo;
  }

  crom(i, t) {
    const p = this.p, n = p.length;
    const p0 = p[(i - 1 + n) % n], p1 = p[i % n], p2 = p[(i + 1) % n], p3 = p[(i + 2) % n];
    const t2 = t * t, t3 = t2 * t;
    const f = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
    return { x: f(p0.x, p1.x, p2.x, p3.x), z: f(p0.z, p1.z, p2.z, p3.z) };
  }

  // Muestra correspondiente a una distancia s en METROS.
  // Las muestras están espaciadas por parámetro de curva, no por longitud, así
  // que interpolar por índice da un punto equivocado: hay que buscar en el
  // campo s. Esto lo usan el cronómetro, la IA y la detección de pista.
  en(s) {
    const largo = this.largo;
    s = ((s % largo) + largo) % largo;
    const T = this.tabla;
    let lo = 0, hi = T.length - 1;
    while (lo < hi) {
      const m = (lo + hi + 1) >> 1;
      if (T[m].s <= s) lo = m; else hi = m - 1;
    }
    // Se interpola entre las dos muestras que envuelven a s. Sin esto el punto
    // se engancha a la muestra anterior y da un error de hasta un espaciado.
    const a = T[lo], b = T[(lo + 1) % T.length];
    let ds = b.s - a.s;
    if (ds <= 0) ds += largo;
    const f = ds > 1e-6 ? (s - a.s) / ds : 0;
    return {
      s, i: a.i, t: a.t,
      x: a.x + (b.x - a.x) * f, z: a.z + (b.z - a.z) * f,
      tx: a.tx, tz: a.tz, nx: a.nx, nz: a.nz,
      curv: a.curv + ((b.curv - a.curv) || 0) * f,
    };
  }

  // Proyecta un punto del mundo sobre la traza. Devuelve la distancia s
  // recorrida y el desvío lateral: con eso se sabe si estás en pista.
  proyectar(x, z, cerca = null) {
    let mejor = null, mejorD = Infinity;
    const T = this.tabla, n = T.length;
    // Si sabemos dónde estaba antes, sólo se mira alrededor: O(1) por frame.
    const desde = cerca == null ? 0 : this.indiceDe(cerca) - 24;
    const cuantos = cerca == null ? n : 48;
    for (let j = 0; j < cuantos; j++) {
      const a = T[((desde + j) % n + n) % n];
      const d = (a.x - x) ** 2 + (a.z - z) ** 2;
      if (d < mejorD) { mejorD = d; mejor = a; }
    }
    const dx = x - mejor.x, dz = z - mejor.z;
    return {
      s: mejor.s + dx * mejor.tx + dz * mejor.tz,
      lateral: dx * mejor.nx + dz * mejor.nz,
      muestra: mejor,
    };
  }
}

// ===== track/track.js =====
// Circuito procedural: puntos de control sobre un anillo deformado, suavizados
// en una curva cerrada. Cada semilla da un trazado distinto, con rectas,
// curvas rápidas y algo lento donde frenar de verdad.
function generarCircuito(semilla = 7, opciones = {}) {
  const rng = makeRng(semilla);
  const n = opciones.curvas || 16;
  const radio = opciones.radio || 470;
  // Radios al azar pero SUAVIZADOS: sin este paso salen quiebres con radios de
  // doce metros, más cerrados que una playa de estacionamiento.
  let radios = [];
  for (let i = 0; i < n; i++) radios.push(rng.range(0.52, 1.46));
  const angulos = [];
  for (let i = 0; i < n; i++) angulos.push(rng.range(0.66, 1.34));
  const sumaAng = angulos.reduce((a, b) => a + b, 0);

  const armar = () => {
    const pts = [];
    let acum = 0;
    for (let i = 0; i < n; i++) {
      const a = (acum / sumaAng) * Math.PI * 2;
      acum += angulos[i];
      const r = radio * radios[i];
      pts.push({ x: Math.cos(a) * r, z: Math.sin(a) * r * 0.84 });
    }
    return new Spline(pts, 26);
  };
  const radioMinimo = (sp) => {
    let c = 0;
    for (let d = 0; d < sp.largo; d += 4) c = Math.max(c, Math.abs(sp.en(d).curv || 0));
    return c > 0 ? 1 / c : 1e9;
  };

  // Se suaviza sólo lo necesario: demasiado suave da un óvalo sin frenadas,
  // demasiado crudo da quiebres imposibles. Se busca un radio mínimo de
  // horquilla de verdad, entre 28 y 45 metros.
  let linea = armar();
  for (let intento = 0; intento < 8 && radioMinimo(linea) < 28; intento++) {
    radios = radios.map((v, i) => (radios[(i - 1 + n) % n] + v * 3.2 + radios[(i + 1) % n]) / 5.2);
    linea = armar();
  }

  // Ancho variable: se abre en las rectas y se cierra en lo lento.
  const anchoEn = (s) => {
    const m = linea.en(s);
    const c = Math.abs(m.curv || 0);
    return 10.5 + Math.max(0, 4.2 - c * 260);
  };

  return { linea, anchoEn, semilla, largo: linea.largo };
}

// Dónde está el auto respecto de la pista: en asfalto, en el piano, o afuera.
function superficie(circuito, lateral, s) {
  const w = circuito.anchoEn(s) / 2;
  const d = Math.abs(lateral);
  if (d < w) return { tipo: 'asfalto', mu: 1.0 };
  if (d < w + 1.6) return { tipo: 'piano', mu: 0.92 };
  if (d < w + 12) return { tipo: 'pasto', mu: 0.55 };
  return { tipo: 'afuera', mu: 0.45 };
}

// ===== track/mesh.js =====
// Geometría del circuito: cinta de asfalto, pianitos rojos y blancos,
// escapatoria de pasto, guardrails y una largada pintada.
const PASO = 6;              // metros entre secciones transversales
const PIANO = 1.6;
const ESCAPE = 13;

function textura(color, ruido = 0.06, size = 64, semilla = 3) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = color; x.fillRect(0, 0, size, size);
  const rng = makeRng(semilla);
  for (let i = 0; i < size * size * 0.45; i++) {
    const g = rng.chance(0.5) ? 255 : 0;
    x.fillStyle = `rgba(${g},${g},${g},${rng.range(0, ruido)})`;
    x.fillRect(rng.range(0, size), rng.range(0, size), 1, 1);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function construirCircuito(circuito, escena) {
  const grupo = new THREE.Group();
  const asf = new MeshBuilder(), pianoA = new MeshBuilder(), pianoB = new MeshBuilder();
  const pasto = new MeshBuilder(), rail = new MeshBuilder(), linea = new MeshBuilder();
  const L = circuito.largo;
  const n = Math.floor(L / PASO);

  const banda = (mb, s0, s1, o0, o1, y) => {
    const a = circuito.linea.en(s0), b = circuito.linea.en(s1);
    mb.quad(
      a.x + a.nx * o0, y, a.z + a.nz * o0,
      a.x + a.nx * o1, y, a.z + a.nz * o1,
      b.x + b.nx * o1, y, b.z + b.nz * o1,
      b.x + b.nx * o0, y, b.z + b.nz * o0,
      (o1 - o0) / 4, PASO / 4
    );
  };

  for (let i = 0; i < n; i++) {
    const s0 = i * PASO, s1 = (i + 1) * PASO;
    const w0 = circuito.anchoEn(s0) / 2;
    banda(asf, s0, s1, -w0, w0, 0.02);
    banda(pasto, s0, s1, w0 + PIANO, w0 + PIANO + ESCAPE, 0.0);
    banda(pasto, s0, s1, -w0 - PIANO - ESCAPE, -w0 - PIANO, 0.0);
    // Pianito alternando color cada dos secciones.
    const mb = (i % 2 === 0) ? pianoA : pianoB;
    banda(mb, s0, s1, w0, w0 + PIANO, 0.05);
    banda(mb, s0, s1, -w0 - PIANO, -w0, 0.05);

    // Guardrail: postes y una chapa continua.
    if (i % 2 === 0) {
      for (const lado of [1, -1]) {
        const o = (w0 + PIANO + ESCAPE) * lado;
        const a = circuito.linea.en(s0), b = circuito.linea.en(s1 + PASO);
        const ax = a.x + a.nx * o, az = a.z + a.nz * o;
        const bx = b.x + b.nx * o, bz = b.z + b.nz * o;
        rail.quad(ax, 0.45, az, bx, 0.45, bz, bx, 1.05, bz, ax, 1.05, az, 3, 1);
        rail.quad(bx, 0.45, bz, ax, 0.45, az, ax, 1.05, az, bx, 1.05, bz, 3, 1);
      }
    }
  }

  // Largada: una franja blanca cruzando la pista.
  {
    const w = circuito.anchoEn(0) / 2;
    banda(linea, 0, 2.2, -w, w, 0.06);
  }

  const material = (map, extra = {}) =>
    new THREE.MeshLambertMaterial({ map, ...extra });
  const agregar = (mb, mat) => {
    if (!mb.count) return;
    const m = new THREE.Mesh(mb.toGeometry(), mat);
    m.receiveShadow = true;
    grupo.add(m);
  };

  const tAsf = textura('#3c3f45', 0.09, 64, 11); tAsf.repeat.set(1, 1);
  agregar(asf, material(tAsf));
  agregar(pasto, material(textura('#33502c', 0.14, 64, 5)));
  agregar(pianoA, new THREE.MeshLambertMaterial({ color: 0xcf3b30 }));
  agregar(pianoB, new THREE.MeshLambertMaterial({ color: 0xe8e4d8 }));
  agregar(rail, new THREE.MeshLambertMaterial({ color: 0xb9bcc2, side: THREE.DoubleSide }));
  agregar(linea, new THREE.MeshBasicMaterial({ color: 0xf2efe6 }));

  // Piso general más allá de la escapatoria.
  const piso = new THREE.Mesh(
    new THREE.PlaneGeometry(6000, 6000),
    material(textura('#2c4426', 0.12, 64, 9))
  );
  piso.rotation.x = -Math.PI / 2;
  piso.position.y = -0.05;
  piso.material.map.repeat.set(300, 300);
  grupo.add(piso);

  escena.add(grupo);
  return grupo;
}

// ===== input/wheel.js =====
// Lectura del volante por Gamepad API, con teclado como respaldo.
//
// AVISO HONESTO: esto se escribió sin un G29 a mano para probarlo. El mapeo
// por defecto es el habitual en Chrome, pero varía según sistema operativo y
// según si los pedales están en modo combinado. Por eso hay calibración: se
// aprende qué eje mueve cada pedal y su recorrido real, y se guarda.
const GUARDADO = 'trazada.volante.v1';

const PREDET = {
  ejeVolante: 0,
  ejeAcelerador: 1, ejeFreno: 2, ejeEmbrague: 3,
  invAcelerador: true, invFreno: true, invEmbrague: true,
  rangoGrados: 540,       // recorrido del volante usado de tope a tope
  zonaMuerta: 0.012,
};

class Wheel {
  constructor() {
    this.cfg = { ...PREDET, ...this.leer() };
    this.gp = null;
    this.id = '';
    this.crudos = [];
    this.calibrando = null;
    this.rangos = {};       // eje -> {min, max} aprendidos
    this.teclas = new Set();
    addEventListener('keydown', (e) => { this.teclas.add(e.code); });
    addEventListener('keyup', (e) => { this.teclas.delete(e.code); });
    addEventListener('gamepadconnected', (e) => { this.id = e.gamepad.id; });
  }

  leer() { try { return JSON.parse(localStorage.getItem(GUARDADO) || '{}'); } catch (_) { return {}; } }
  guardar() { try { localStorage.setItem(GUARDADO, JSON.stringify(this.cfg)); } catch (_) {} }

  buscar() {
    const lista = navigator.getGamepads ? navigator.getGamepads() : [];
    let mejor = null;
    for (const g of lista) {
      if (!g) continue;
      const esVolante = /g29|g920|g27|driving force|logitech|wheel|thrustmaster|fanatec/i.test(g.id);
      if (esVolante) { mejor = g; break; }
      if (!mejor) mejor = g;
    }
    this.gp = mejor;
    if (mejor) { this.id = mejor.id; this.crudos = Array.from(mejor.axes); }
    return mejor;
  }

  get conectado() { return !!this.gp; }
  get esVolante() { return !!this.gp && /g29|g920|g27|driving force|wheel|thrustmaster|fanatec/i.test(this.id); }

  pedal(eje, invertir) {
    if (!this.gp || eje == null || this.gp.axes[eje] === undefined) return 0;
    let v = this.gp.axes[eje];
    const r = this.rangos[eje];
    if (r && r.max - r.min > 0.4) v = (v - r.min) / (r.max - r.min) * 2 - 1;
    // Los pedales de Logitech descansan en +1 y llegan a -1 al fondo.
    const u = invertir ? (1 - v) / 2 : (v + 1) / 2;
    return Math.max(0, Math.min(1, u));
  }

  // Estado normalizado que consume el juego. `kmh` sólo se usa para suavizar
  // la dirección por teclado; con volante de verdad el mando va uno a uno.
  estado(kmh = 0) {
    this.buscar();
    const c = this.cfg;
    const s = { volante: 0, acelerador: 0, freno: 0, embrague: 0, mano: false, volanteReal: false };

    if (this.gp) {
      const bruto = this.gp.axes[c.ejeVolante] || 0;
      // El recorrido físico es de 900°; se usa sólo el tramo configurado.
      const escala = 900 / Math.max(90, c.rangoGrados);
      let v = bruto * escala;
      if (Math.abs(v) < c.zonaMuerta) v = 0;
      s.volante = Math.max(-1, Math.min(1, v));
      s.acelerador = this.pedal(c.ejeAcelerador, c.invAcelerador);
      s.freno = this.pedal(c.ejeFreno, c.invFreno);
      s.embrague = this.pedal(c.ejeEmbrague, c.invEmbrague);
      s.volanteReal = this.esVolante;
      // Levas y botones: subir y bajar cambio.
      s.subir = !!(this.gp.buttons[4] && this.gp.buttons[4].pressed);
      s.bajar = !!(this.gp.buttons[5] && this.gp.buttons[5].pressed);
    }

    // Teclado: siempre disponible, y suma al volante si no hay nada conectado.
    const t = this.teclas;
    const kx = (t.has('KeyD') || t.has('ArrowRight') ? 1 : 0) - (t.has('KeyA') || t.has('ArrowLeft') ? 1 : 0);
    // A 200 km/h nadie clava el volante a tope: con teclado hay que limitarlo
    // o el auto se pasa de deriva y ara de trompa en cada curva.
    const tope = Math.max(0.16, 1 / (1 + kmh * 0.011));
    if (kx) {
      this.tecladoVolante = Math.max(-tope, Math.min(tope, (this.tecladoVolante || 0) + kx * 0.055));
    } else {
      this.tecladoVolante = (this.tecladoVolante || 0) * 0.80;
    }
    this.tecladoVolante = Math.max(-tope, Math.min(tope, this.tecladoVolante));
    if (!s.volanteReal && Math.abs(this.tecladoVolante) > 0.001) s.volante = this.tecladoVolante;
    if (t.has('KeyW') || t.has('ArrowUp')) s.acelerador = 1;
    if (t.has('KeyS') || t.has('ArrowDown')) s.freno = 1;
    if (t.has('Space')) s.mano = true;
    return s;
  }

  // Calibración: se aprende el recorrido de cada eje mientras el jugador
  // mueve volante y pedales, y después se asigna el eje que más se movió.
  empezarCalibracion() {
    this.calibrando = { t: 0, rangos: {} };
    this.rangos = {};
  }
  pasoCalibracion(dt) {
    if (!this.calibrando) return null;
    this.buscar();
    this.calibrando.t += dt;
    if (this.gp) {
      this.gp.axes.forEach((v, i) => {
        const r = this.calibrando.rangos[i] || (this.calibrando.rangos[i] = { min: v, max: v });
        r.min = Math.min(r.min, v); r.max = Math.max(r.max, v);
      });
    }
    return this.calibrando.t;
  }
  terminarCalibracion() {
    if (!this.calibrando) return null;
    const r = this.calibrando.rangos;
    const movidos = Object.entries(r)
      .map(([i, v]) => ({ i: +i, rec: v.max - v.min, ...v }))
      .filter(e => e.rec > 0.35)
      .sort((a, b) => b.rec - a.rec);
    this.rangos = {};
    for (const e of movidos) this.rangos[e.i] = { min: e.min, max: e.max };
    this.calibrando = null;
    return movidos;
  }

  asignar(campo, eje) { this.cfg[campo] = eje; this.guardar(); }
}

// ===== race/timing.js =====
// Cronómetro: vueltas, parciales y mejor vuelta guardada.
const CLAVE = 'trazada.mejores.v1';

class Timing {
  constructor(circuito, semilla) {
    this.c = circuito;
    this.clave = 'pista' + semilla;
    this.vuelta = 0;
    this.tiempo = 0;
    this.mejor = this.leerMejor();
    this.ultima = null;
    this.sPrev = 0;
    this.parciales = [0, 0, 0];
    this.sector = 0;
    this.vueltas = [];
    this.valida = true;
  }

  leerMejor() {
    try { return JSON.parse(localStorage.getItem(CLAVE) || '{}')[this.clave] ?? null; }
    catch (_) { return null; }
  }
  guardarMejor(t) {
    try {
      const d = JSON.parse(localStorage.getItem(CLAVE) || '{}');
      d[this.clave] = t;
      localStorage.setItem(CLAVE, JSON.stringify(d));
    } catch (_) {}
  }

  update(dt, s, enPista) {
    this.tiempo += dt;
    if (!enPista) this.valida = false;
    const L = this.c.largo;
    const tercio = L / 3;
    const secActual = Math.min(2, Math.floor(s / tercio));
    if (secActual !== this.sector && secActual === this.sector + 1) {
      this.parciales[this.sector] = this.tiempo;
      this.sector = secActual;
    }
    // Cruce de meta hacia adelante: s pasa de casi L a casi 0.
    const cruzo = this.sPrev > L * 0.75 && s < L * 0.25;
    this.sPrev = s;
    if (!cruzo) return null;

    const t = this.tiempo;
    this.tiempo = 0; this.sector = 0;
    this.vuelta++;
    if (this.vuelta > 1) {
      this.ultima = t;
      this.vueltas.push({ t, valida: this.valida });
      if (this.valida && (this.mejor === null || t < this.mejor)) {
        this.mejor = t; this.guardarMejor(t);
        this.valida = true;
        return { tiempo: t, record: true };
      }
      const r = { tiempo: t, record: false, invalida: !this.valida };
      this.valida = true;
      return r;
    }
    this.valida = true;
    return null;
  }
}

function reloj(t) {
  if (t == null) return '--:--.---';
  const m = Math.floor(t / 60);
  const s = t - m * 60;
  return `${m}:${s.toFixed(3).padStart(6, '0')}`;
}

// ===== race/piloto.js =====
// ⚠ INCOMPLETO — NO ESTÁ ENCHUFADO AL JUEGO.
//
// Piloto automático por persecución pura, pensado como rival y como conductor
// de pruebas. Sigue la traza y calcula la frenada por radio y agarre, pero HOY
// NO COMPLETA UNA VUELTA: se va de pista en las curvas encadenadas y no sabe
// recuperarse cuando queda cruzado o andando para atrás.
//
// Lo que falta, sabido:
//   - Traza optimizada (entrada ancha, vértice, salida) en vez del eje de pista
//   - Máquina de estados con recuperación: detectar trompo y reencarar
//   - Ajustar la frenada midiendo contra vueltas reales, no contra la teoría
//
// Se deja en el repo porque el andamiaje sirve, no porque funcione.
class Piloto {
  constructor(circuito, opciones = {}) {
    this.c = circuito;
    this.agresividad = opciones.agresividad ?? 0.86;   // 1 = al límite teórico
    this.horizonte = opciones.horizonte ?? 320;        // metros que mira adelante para frenar
    this.s = 0;
  }

  // Velocidad máxima a la que se puede pasar por una curvatura dada.
  vMax(curv, mu) {
    const k = Math.abs(curv);
    if (k < 1e-5) return 999;
    return Math.sqrt(mu * 9.81 / k) * this.agresividad;
  }

  conducir(auto, sActual, lateral = 0, mu = 1.35) {
    this.s = sActual;
    const v = auto.velocidad;
    const L = auto.s.a + auto.s.b;

    // Persecución pura: se calcula la CURVATURA necesaria para llegar al punto
    // de mira y de ahí el ángulo de rueda, en vez de multiplicar un error
    // angular por una ganancia. La diferencia importa: una ganancia fija pide
    // ángulos imposibles a alta velocidad y el auto hace trompo.
    const Ld = clamp(11 + v * 0.72, 14, 75);
    const obj = this.c.linea.en(sActual + Ld);
    const dx = obj.x - auto.x, dz = obj.z - auto.z;
    const dist = Math.max(6, Math.hypot(dx, dz));
    const alfa = angDelta(auto.yaw, Math.atan2(dx, dz));
    let delta = Math.atan(2 * L * Math.sin(alfa) / dist);

    // Corrección de desvío. Volante positivo gira a la izquierda y la normal
    // de la traza apunta a la derecha, así que el signo va en más.
    delta += clamp(lateral * 0.016, -0.09, 0.09);
    const volante = clamp(delta / auto.s.volanteMax, -1, 1);

    let acelerador = 1, freno = 0;
    const desac = mu * 7.2;
    for (let d = 6; d < this.horizonte; d += 6) {
      const m = this.c.linea.en(sActual + d);
      const vc = this.vMax(m.curv, mu);
      if (vc >= v) continue;
      const necesaria = (v * v - vc * vc) / (2 * desac);
      const margen = 14;
      if (necesaria > d - margen) { freno = clamp((necesaria - d + margen) / 18, 0, 1); acelerador = 0; break; }
    }
    const aqui = this.vMax(this.c.linea.en(sActual + 6).curv, mu);
    if (v > aqui * 1.04) { acelerador = 0; freno = Math.max(freno, 0.3); }
    else if (freno === 0) acelerador = clamp(1 - Math.abs(volante) * 0.5, 0.3, 1);

    // Elipse de fricción: el agarre es UNO SOLO. Frenar a fondo mientras
    // doblás pide más de lo que hay y el auto se va de trompa o hace trompo.
    // El freno cede ante la dirección, que es lo que hace un piloto de verdad.
    const giro = Math.abs(volante);
    freno *= clamp(1 - giro * 1.25, 0.12, 1);
    acelerador *= clamp(1 - giro * 0.75, 0.22, 1);

    auto.mandos.volante = volante;
    auto.mandos.acelerador = acelerador;
    auto.mandos.freno = freno;
    auto.mandos.mano = false;
    return { volante, acelerador, freno };
  }
}

// ===== race/rival.js =====
// Rivales cinemáticos: corren sobre la traza con un perfil de velocidad
// calculado por curvatura, en vez de simular física completa.
//
// Es una decisión, no una excusa: un piloto con física completa que sepa
// recuperarse de un trompo es un proyecto en sí mismo, y esto es lo que usan
// los arcades de verdad. Se ve bien, no se va nunca de pista, y pelea.
const COLORES = [0x3aa0ff, 0x35d07f, 0xffc447, 0xb06cff, 0xff6b4a, 0xe8e4d8, 0x18b6a6, 0xff4d8d];
const NOMBRES = ['Barrales', 'Ferrante', 'Godoy', 'Sarti', 'Ledesma', 'Quiroga', 'Nieto', 'Ávila'];

class Rival {
  constructor(circuito, escena, i, opciones = {}) {
    this.c = circuito;
    this.i = i;
    this.nombre = NOMBRES[i % NOMBRES.length];
    this.destreza = opciones.destreza ?? (0.90 + (i % 4) * 0.025);
    this.topeKmh = opciones.topeKmh ?? 225;
    this.acel = opciones.acel ?? 7.4;         // m/s² efectivos en salida
    this.mu = opciones.mu ?? 1.34;
    this.malla = construirAuto(COLORES[i % COLORES.length]);
    escena.add(this.malla);

    this.s = 0; this.v = 0; this.carril = 0; this.carrilObj = 0;
    this.vuelta = 0; this.yaw = 0; this.x = 0; this.z = 0;
    this.terminado = false; this.tiempo = 0;
    this.giroRueda = 0;
  }

  colocar(s, carril) {
    this.s = ((s % this.c.largo) + this.c.largo) % this.c.largo;
    this.carril = this.carrilObj = carril;
    this.v = 0; this.vuelta = 0; this.terminado = false; this.tiempo = 0;
    this.sincronizar();
  }

  vMax(curv) {
    const k = Math.abs(curv);
    if (k < 1e-5) return 999;
    return Math.sqrt(this.mu * 9.81 / k) * this.destreza;
  }

  // Velocidad objetivo: la menor que permita la curva más exigente que viene,
  // considerando cuánto se puede frenar de acá hasta ahí.
  objetivo() {
    const tope = this.topeKmh / 3.6;
    let v = tope;
    const desac = this.mu * 8.5;
    for (let d = 4; d < 260; d += 6) {
      const vc = this.vMax(this.c.linea.en(this.s + d).curv);
      if (vc >= tope) continue;
      // Velocidad máxima ahora para poder llegar a vc dentro de d metros.
      const permitida = Math.sqrt(vc * vc + 2 * desac * Math.max(0, d - 5));
      v = Math.min(v, permitida);
    }
    return Math.min(v, this.vMax(this.c.linea.en(this.s + 5).curv));
  }

  update(dt, mundo) {
    if (this.terminado) { this.sincronizar(); return; }
    this.tiempo += dt;
    const L = this.c.largo;

    let obj = this.objetivo();

    // Tráfico: si tengo a alguien pegado adelante en mi mismo carril, levanto
    // y busco otro carril para pasarlo.
    let bloqueo = null, gap = 1e9;
    for (const o of mundo.otros) {
      if (o === this) continue;
      let d = o.s - this.s;
      if (d < -L / 2) d += L;
      if (d > L / 2) d -= L;
      if (d > 0 && d < 34 && Math.abs(o.carril - this.carril) < 2.4 && d < gap) { gap = d; bloqueo = o; }
    }
    if (bloqueo) {
      obj = Math.min(obj, bloqueo.v + Math.max(0, (gap - 7)) * 0.55);
      const ancho = this.c.anchoEn(this.s) / 2 - 1.6;
      const lado = bloqueo.carril >= 0 ? -1 : 1;
      this.carrilObj = clamp(bloqueo.carril + lado * 3.0, -ancho, ancho);
    } else {
      this.carrilObj *= 0.94;      // vuelve a la traza
    }

    const acel = obj > this.v ? this.acel * clamp(1 - this.v / (this.topeKmh / 3.6), 0.18, 1)
                              : -this.mu * 9.0;
    this.v = Math.max(2, this.v + acel * dt);
    if (acel < 0) this.v = Math.max(obj, this.v);
    else this.v = Math.min(obj, this.v);

    const antes = this.s;
    this.s += this.v * dt;
    if (this.s >= L) { this.s -= L; this.vuelta++; }
    this.carril += (this.carrilObj - this.carril) * Math.min(1, dt * 2.2);
    this.giroRueda += (this.v / 0.315) * dt;
    this.sincronizar();
  }

  sincronizar() {
    const m = this.c.linea.en(this.s);
    this.x = m.x + m.nx * this.carril;
    this.z = m.z + m.nz * this.carril;
    this.yaw = Math.atan2(m.tx, m.tz);
    this.malla.position.set(this.x, 0, this.z);
    this.malla.rotation.y = this.yaw;
    for (const k in this.malla.userData.ruedas)
      this.malla.userData.ruedas[k].rotation.x = this.giroRueda;
  }

  get avance() { return this.vuelta * this.c.largo + this.s; }
  get kmh() { return this.v * 3.6; }
}

// ===== race/carrera.js =====
// Estructura de carrera: grilla, largada, vueltas, posiciones y llegada.
// Sin esto el juego era una pista vacía con un cronómetro.
class Carrera {
  constructor(circuito, escena) {
    this.c = circuito;
    this.escena = escena;
    this.rivales = [];
    this.estado = 'libre';       // libre | cuenta | corriendo | final
    this.vueltas = 3;
    this.cuenta = 0;
    this.tiempo = 0;
    this.jugador = { vuelta: 0, s: 0, sPrev: 0, terminado: false, tiempo: 0, puesto: 1 };
    this.resultado = null;
  }

  preparar(config, jugadorSpec) {
    const n = config.rivales ?? 5;
    this.vueltas = config.vueltas ?? 3;
    this.nombreEvento = config.nombre || 'Carrera';
    this.premio = config.premio ?? 60000;

    for (const r of this.rivales) this.escena.remove(r.malla);
    this.rivales = [];
    const L = this.c.largo;
    // El jugador larga último: es más divertido tener a quién pasar.
    for (let i = 0; i < n; i++) {
      const r = new Rival(this.c, this.escena, i, {
        destreza: (config.destreza ?? 0.92) + (i - n / 2) * 0.012,
        topeKmh: config.topeKmh ?? 215,
        mu: config.mu ?? 1.34,
        acel: config.acel ?? 7.2,
      });
      const fila = Math.floor(i / 2), lado = (i % 2) ? 1 : -1;
      r.colocar(L - 14 - fila * 9, lado * 2.4);
      this.rivales.push(r);
    }
    const filaJ = Math.floor(n / 2);
    this.grillaJugador = {
      s: L - 14 - filaJ * 9,
      carril: (n % 2) ? 1 * 2.4 : -2.4,
    };
    this.estado = 'cuenta';
    this.cuenta = 3.999;
    this.tiempo = 0;
    this.resultado = null;
    this.jugador = { vuelta: 0, s: this.grillaJugador.s, sPrev: this.grillaJugador.s, terminado: false, tiempo: 0, puesto: n + 1 };
    return this.grillaJugador;
  }

  abandonar() {
    for (const r of this.rivales) this.escena.remove(r.malla);
    this.rivales = [];
    this.estado = 'libre';
    this.resultado = null;
  }

  get corriendo() { return this.estado === 'corriendo'; }
  get largando() { return this.estado === 'cuenta'; }

  update(dt, sJugador) {
    if (this.estado === 'libre' || this.estado === 'final') return null;

    if (this.estado === 'cuenta') {
      this.cuenta -= dt;
      if (this.cuenta <= 0) { this.estado = 'corriendo'; this.cuenta = 0; }
      return null;
    }

    this.tiempo += dt;
    const L = this.c.largo;
    for (const r of this.rivales) r.update(dt, { otros: this.rivales });

    // Vueltas del jugador: cruzar meta hacia adelante.
    const j = this.jugador;
    if (!j.terminado) {
      j.tiempo += dt;
      if (j.sPrev > L * 0.75 && sJugador < L * 0.25) j.vuelta++;
      j.sPrev = sJugador;
      j.s = sJugador;
    }

    const avanceJ = j.vuelta * L + j.s;
    const todos = [
      { nombre: 'VOS', avance: avanceJ, vuelta: j.vuelta, jugador: true, terminado: j.terminado, tiempo: j.tiempo },
      ...this.rivales.map(r => ({ nombre: r.nombre, avance: r.avance, vuelta: r.vuelta, jugador: false, terminado: r.terminado, tiempo: r.tiempo })),
    ];
    todos.sort((a, b) => (b.terminado - a.terminado) || (b.avance - a.avance));
    this.orden = todos;
    j.puesto = todos.findIndex(t => t.jugador) + 1;

    // Llegada
    for (const r of this.rivales)
      if (!r.terminado && r.vuelta >= this.vueltas) r.terminado = true;
    if (!j.terminado && j.vuelta >= this.vueltas) {
      j.terminado = true;
      this.estado = 'final';
      const puesto = j.puesto;
      const factor = [1, 0.62, 0.42, 0.3, 0.22, 0.16, 0.12, 0.1][puesto - 1] ?? 0.08;
      this.resultado = {
        puesto, total: todos.length, tiempo: j.tiempo,
        plata: Math.round(this.premio * factor),
        xp: Math.round(180 * factor + 40),
      };
      return this.resultado;
    }
    return null;
  }
}

// ===== race/puntaje.js =====
// Cadenas de habilidad, al estilo Horizon: derrapar, pasar cerca y sostener
// velocidad suman puntos con un multiplicador que crece mientras no cortes.
// Chocar o irte al pasto te lo baja. Es lo que hace que manejar sea un juego
// y no una vuelta de reconocimiento.
class Puntaje {
  constructor() {
    this.banco = 0;          // puntos ya asegurados
    this.cadena = 0;         // puntos de la cadena en curso
    this.mult = 1;
    this.ocio = 0;
    this.ultimo = '';
    this.ultimoT = 0;
    this.cerca = new Map();  // rival -> tiempo del último "casi"
    this.mejorCadena = 0;
  }

  aviso(texto) { this.ultimo = texto; this.ultimoT = 1.6; }

  sumar(p, texto) {
    if (p <= 0) return;
    this.cadena += p * this.mult;
    this.mult = Math.min(10, this.mult + p / 900);
    this.ocio = 0;
    if (texto) this.aviso(texto);
  }

  romper(motivo) {
    if (this.cadena > 0) this.aviso(motivo);
    this.cadena = 0; this.mult = 1; this.ocio = 0;
  }

  cobrar() {
    if (this.cadena > 0) {
      this.banco += Math.round(this.cadena);
      this.mejorCadena = Math.max(this.mejorCadena, Math.round(this.cadena));
    }
    this.cadena = 0; this.mult = 1;
  }

  update(dt, mundo) {
    this.ultimoT = Math.max(0, this.ultimoT - dt);
    const { auto, enPista, rivales, choque } = mundo;
    const kmh = auto.kmh;

    if (choque > 4) { this.romper('¡Golpe! Cadena perdida'); return; }
    if (!enPista) { this.romper('Fuera de pista'); return; }

    // Derrape: ángulo de deriva trasero sostenido con velocidad.
    const deriva = Math.abs(auto.slipL.TI + auto.slipL.TD) / 2 * 57.3;
    if (deriva > 11 && kmh > 45 && auto.uso.TI > 0.85) {
      this.sumar(deriva * kmh * dt * 0.055, null);
      if (this.ultimoT <= 0) this.aviso('Derrape');
    }

    // Pasar cerca: te cruzás a menos de 4 metros a buena velocidad.
    for (const r of rivales) {
      const d = Math.hypot(r.x - auto.x, r.z - auto.z);
      const t = this.cerca.get(r) || 0;
      if (d < 4.2 && kmh > 70 && performance.now() - t > 2200) {
        this.cerca.set(r, performance.now());
        this.sumar(240, '¡Casi!');
      }
    }

    // Velocidad sostenida.
    if (kmh > 175) this.sumar((kmh - 175) * dt * 2.2, null);

    // La cadena se cobra sola si dejás de hacer cosas.
    this.ocio += dt;
    if (this.ocio > 2.4 && this.cadena > 0) {
      const p = Math.round(this.cadena);
      this.cobrar();
      this.aviso(`+${p.toLocaleString('es-AR')} puntos`);
    }
    this.mult = Math.max(1, this.mult - dt * 0.14);
  }

  get total() { return this.banco + Math.round(this.cadena); }
}

// ===== race/progreso.js =====
// Plata, experiencia y garage, guardados en el navegador.
const CLAVE_rogresojs = 'trazada.progreso.v1';

class Progreso {
  constructor() {
    this.plata = 180000;
    this.xp = 0;
    this.autos = { calle: { mejoras: {} } };   // arrancás con el compacto
    this.actual = 'calle';
    this.mejores = {};
    this.puntos = 0;
    this.carreras = { corridas: 0, ganadas: 0 };
    this.cargar();
  }

  get nivel() { return Math.floor(Math.sqrt(this.xp / 120)) + 1; }
  get xpNivel() { const n = this.nivel; return { hecho: this.xp - 120 * (n - 1) ** 2, falta: 120 * (n ** 2 - (n - 1) ** 2) }; }

  tiene(k) { return !!this.autos[k]; }
  mejorasDe(k) { return (this.autos[k] || {}).mejoras || {}; }

  comprarAuto(k) {
    const a = AUTOS[k];
    if (!a || this.tiene(k)) return 'ya lo tenés';
    if (this.plata < a.precio) return 'sin plata';
    this.plata -= a.precio;
    this.autos[k] = { mejoras: {} };
    this.actual = k;
    this.guardar();
    return 'comprado';
  }

  mejorar(k, clave) {
    if (!this.tiene(k)) return 'no es tuyo';
    const m = this.autos[k].mejoras;
    const nivel = m[clave] || 0;
    const costo = costoMejora(clave, nivel);
    if (costo === null) return 'al máximo';
    if (this.plata < costo) return 'sin plata';
    this.plata -= costo;
    m[clave] = nivel + 1;
    this.guardar();
    return 'mejorado';
  }

  premiar(plata, xp) { this.plata += plata; this.xp += xp; this.guardar(); }
  sumarPuntos(p) { this.puntos += p; }

  registrarVuelta(pista, t) {
    const k = 'p' + pista;
    if (this.mejores[k] == null || t < this.mejores[k]) { this.mejores[k] = t; this.guardar(); return true; }
    return false;
  }

  guardar() {
    try {
      localStorage.setItem(CLAVE_rogresojs, JSON.stringify({
        v: 1, plata: this.plata, xp: this.xp, autos: this.autos,
        actual: this.actual, mejores: this.mejores, puntos: this.puntos, carreras: this.carreras,
      }));
    } catch (_) {}
  }

  cargar() {
    let d;
    try { d = JSON.parse(localStorage.getItem(CLAVE_rogresojs) || 'null'); } catch (_) { return; }
    if (!d || d.v !== 1) return;
    this.plata = d.plata ?? this.plata;
    this.xp = d.xp ?? 0;
    this.autos = d.autos || this.autos;
    this.actual = this.autos[d.actual] ? d.actual : Object.keys(this.autos)[0];
    this.mejores = d.mejores || {};
    this.puntos = d.puntos || 0;
    this.carreras = d.carreras || this.carreras;
  }
}

class Hud {
  constructor() {
    const st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
    const r = document.createElement('div'); r.id = 'hud';
    r.innerHTML = `
      <div class="p" id="tiempos">
        <div class="act" id="v-act">0:00.000</div>
        <div class="f"><span class="k">Mejor</span><span class="v rec" id="v-mejor">--:--.---</span></div>
        <div class="f"><span class="k">Última</span><span class="v" id="v-ult">--:--.---</span></div>
        <div class="f"><span class="k">Vuelta</span><span class="v" id="v-vta">1</span></div>
      </div>
      <div class="p" id="tacho">
        <div><span class="marcha" id="v-marcha">1</span></div>
        <div class="vel"><span id="v-kmh">0</span><i>km/h</i></div>
        <div class="rpm"><i id="v-rpm"></i></div>
      </div>
      <div class="p" id="gomas">
        <b><i id="v-DI"></i></b><b><i id="v-DD"></i></b>
        <b><i id="v-TI"></i></b><b><i id="v-TD"></i></b>
        <div class="rot">CARGA POR RUEDA</div>
      </div>
      <div class="p" id="mapa"><canvas id="v-mapa" width="190" height="190"></canvas></div>
      <div class="p" id="aviso"><span id="v-aviso"></span></div>
      <div class="p" id="carrera">
        <div class="pos"><span id="v-pos">1</span><i>/<span id="v-total">6</span></i></div>
        <div class="vta">VUELTA <span id="v-lap">1</span>/<span id="v-laps">3</span></div>
      </div>
      <div id="cuenta"><span id="v-cuenta">3</span></div>
      <div class="p" id="tabla"><div id="v-tabla"></div></div>
      <div class="p" id="cadena">
        <div class="pts" id="v-cad">0</div>
        <div class="m">x<span id="v-mult">1.0</span></div>
        <div class="q" id="v-quehizo"></div>
      </div>
      <div class="p" id="volante">
        <span id="v-vol">Teclado</span>
        <div class="b"><i id="v-volpos"></i></div>
      </div>
      <div id="ayuda"><kbd>Tab</kbd> menú y garage · <kbd>W A S D</kbd> manejar · <kbd>R</kbd> volver a pista · <kbd>C</kbd> calibrar volante</div>`;
    document.body.appendChild(r);
    this.el = (id) => document.getElementById(id);
    this.ctx = this.el('v-mapa').getContext('2d');
  }

  update(g) {
    const v = g.auto, t = g.timing;
    this.el('v-act').textContent = reloj(t.tiempo);
    this.el('v-mejor').textContent = reloj(t.mejor);
    this.el('v-ult').textContent = reloj(t.ultima);
    this.el('v-vta').textContent = Math.max(1, t.vuelta);

    this.el('v-kmh').textContent = Math.round(Math.max(0, v.kmh));
    this.el('v-marcha').textContent = v.marcha;
    const frac = Math.min(1, (v.rpm - v.s.rpmRalenti) / (v.s.rpmCorte - v.s.rpmRalenti));
    this.el('v-rpm').style.width = (frac * 100) + '%';

    // Carga por rueda: se ve la transferencia de peso en vivo.
    for (const k of ['DI', 'DD', 'TI', 'TD']) {
      const e = this.el('v-' + k);
      const carga = Math.min(1, v.Fz[k] / (v.estatico[k] * 2.1));
      e.style.height = (carga * 100) + '%';
      const uso = v.uso[k];
      e.style.background = uso > 1.02 ? '#ff4d4d' : uso > 0.88 ? '#ffc447' : '#5ad1a0';
    }

    this.el('v-vol').textContent = g.wheel.conectado
      ? (g.wheel.esVolante ? 'Volante: ' + g.wheel.id.slice(0, 34) : 'Mando: ' + g.wheel.id.slice(0, 30))
      : 'Teclado (no hay volante conectado)';
    this.el('v-volpos').style.left = `calc(${50 + v.mandos.volante * 48}% - 1.5px)`;

    const av = this.el('aviso');
    av.style.opacity = g.avisoT > 0 ? '1' : '0';
    if (g.avisoT > 0) this.el('v-aviso').innerHTML = g.aviso;

    // --- Carrera ---
    const c = g.carrera;
    const enCarrera = c.estado === 'corriendo' || c.estado === 'cuenta' || c.estado === 'final';
    this.el('carrera').classList.toggle('on', enCarrera);
    this.el('tabla').classList.toggle('on', enCarrera && !!c.orden);
    this.el('cuenta').classList.toggle('on', c.estado === 'cuenta');
    if (c.estado === 'cuenta') {
      const n = Math.ceil(c.cuenta);
      this.el('v-cuenta').textContent = n > 3 ? '3' : n <= 0 ? '¡YA!' : String(n);
    }
    if (enCarrera) {
      this.el('v-pos').textContent = c.jugador.puesto;
      this.el('v-total').textContent = (c.rivales.length + 1);
      this.el('v-lap').textContent = Math.min(c.vueltas, c.jugador.vuelta + 1);
      this.el('v-laps').textContent = c.vueltas;
      if (c.orden) {
        this.el('v-tabla').innerHTML = c.orden.map((o, i) =>
          `<div class="r ${o.jugador ? 'yo' : ''}"><span>${i + 1}</span><span class="n">${o.nombre}</span><span>v${o.vuelta + 1}</span></div>`
        ).join('');
      }
    }

    // --- Cadena de habilidad ---
    const pj = g.puntaje;
    const activa = pj.cadena > 0 || pj.ultimoT > 0;
    this.el('cadena').classList.toggle('on', activa);
    if (activa) {
      this.el('v-cad').textContent = Math.round(pj.cadena).toLocaleString('es-AR');
      this.el('v-mult').textContent = pj.mult.toFixed(1);
      this.el('v-quehizo').textContent = pj.ultimoT > 0 ? pj.ultimo : '';
    }

    this.dibujarMapa(g);
  }

  dibujarMapa(g) {
    const c = this.ctx, W = 190;
    c.clearRect(0, 0, W, W);
    const L = g.circuito.linea;
    let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
    if (!this._lim) {
      for (const p of L.tabla) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); z0 = Math.min(z0, p.z); z1 = Math.max(z1, p.z); }
      this._lim = { x0, x1, z0, z1 };
    }
    const l = this._lim, m = 12;
    const k = Math.min((W - m * 2) / (l.x1 - l.x0), (W - m * 2) / (l.z1 - l.z0));
    const tf = (x, z) => [m + (x - l.x0) * k, m + (z - l.z0) * k];

    c.strokeStyle = '#59606d'; c.lineWidth = 4; c.lineJoin = 'round';
    c.beginPath();
    L.tabla.forEach((p, i) => { const q = tf(p.x, p.z); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); });
    c.closePath(); c.stroke();

    const meta = tf(L.tabla[0].x, L.tabla[0].z);
    c.strokeStyle = '#f2efe6'; c.lineWidth = 2;
    c.beginPath(); c.arc(meta[0], meta[1], 3.5, 0, Math.PI * 2); c.stroke();

    for (const r of g.carrera.rivales) {
      const q = tf(r.x, r.z);
      c.fillStyle = '#7fd4ff';
      c.beginPath(); c.arc(q[0], q[1], 2.8, 0, Math.PI * 2); c.fill();
    }
    const p = tf(g.auto.x, g.auto.z);
    c.fillStyle = '#ffc447';
    c.beginPath(); c.arc(p[0], p[1], 4, 0, Math.PI * 2); c.fill();
  }
}

class Menu {
  constructor(juego) {
    this.g = juego;
    this.tab = 'eventos';
    const st = document.createElement('style'); st.textContent = CSS_uimenujs; document.head.appendChild(st);
    this.el = document.createElement('div'); this.el.id = 'menu';
    document.body.appendChild(this.el);
    this.el.addEventListener('click', (e) => this.click(e));
  }

  abrir(on) { this.el.classList.toggle('on', on); if (on) this.render(); }
  get abierto() { return this.el.classList.contains('on'); }

  click(e) {
    const b = e.target.closest('button');
    if (!b) return;
    const { accion, valor, extra } = b.dataset;
    const g = this.g, p = g.progreso;
    if (accion === 'tab') { this.tab = valor; this.render(); return; }
    if (accion === 'correr') { g.empezarCarrera(+valor); this.abrir(false); return; }
    if (accion === 'practicar') { g.practicar(+valor); this.abrir(false); return; }
    if (accion === 'usar') { p.actual = valor; p.guardar(); g.rearmarAuto(); this.render(); return; }
    if (accion === 'comprar') { g.decir(this.texto(p.comprarAuto(valor), AUTOS[valor].nombre), 3); g.rearmarAuto(); this.render(); return; }
    if (accion === 'mejorar') { g.decir(this.texto(p.mejorar(valor, extra), MEJORAS[extra].nombre), 3); g.rearmarAuto(); this.render(); return; }
    if (accion === 'cerrar') { this.abrir(false); }
  }

  texto(r, que) {
    if (r === 'comprado') return `Compraste el ${que}`;
    if (r === 'mejorado') return `${que} mejorado`;
    if (r === 'sin plata') return 'No te alcanza';
    if (r === 'al máximo') return `${que} ya está al máximo`;
    return r;
  }

  render() {
    const g = this.g, p = g.progreso;
    const spec = g.specActual();
    const xn = p.xpNivel;
    const tabs = [['eventos', 'Eventos'], ['garage', 'Garage'], ['taller', 'Taller']];

    let cuerpo = '';
    if (this.tab === 'eventos') {
      cuerpo = `<div class="lista">` + EVENTOS.map(ev => {
        const ok = habilitado(ev, spec);
        const mejor = p.mejores['p' + ev.pista];
        return `<div class="fila ${ok ? '' : 'bloq'}">
          <div class="crece">
            <div class="t">${ev.nombre} <span class="pill">clase ${ev.clase}</span></div>
            <div class="d">Pista ${ev.pista} · ${ev.vueltas} vueltas · premio ${plata(ev.premio)}${mejor ? ' · tu mejor vuelta ' + reloj(mejor) : ''}</div>
          </div>
          <button data-accion="practicar" data-valor="${ev.id}">Practicar</button>
          <button class="on" data-accion="correr" data-valor="${ev.id}" ${ok ? '' : 'disabled'}>Correr</button>
        </div>`;
      }).join('') + `</div>`;
      if (!EVENTOS.some(ev => habilitado(ev, spec)))
        cuerpo += `<div class="cerrar">Necesitás un auto de clase superior. Pasá al Garage.</div>`;
    } else if (this.tab === 'garage') {
      cuerpo = `<div class="lista">` + ORDEN_AUTOS.map(k => {
        const a = AUTOS[k], tengo = p.tiene(k), usando = p.actual === k;
        const idx = indice(tengo ? aplicarMejoras(a, p.mejorasDe(k)) : a);
        return `<div class="fila">
          <div class="crece">
            <div class="t">${a.nombre} <span class="pill">clase ${a.clase}</span></div>
            <div class="d">Índice ${idx} · ${a.traccion} · ${Math.round(a.masa)} kg${tengo ? '' : ' · ' + plata(a.precio)}</div>
          </div>
          ${tengo
            ? `<button class="${usando ? 'on' : ''}" data-accion="usar" data-valor="${k}">${usando ? 'En uso' : 'Usar'}</button>`
            : `<button data-accion="comprar" data-valor="${k}" ${p.plata >= a.precio ? '' : 'disabled'}>Comprar</button>`}
        </div>`;
      }).join('') + `</div>`;
    } else {
      const k = p.actual, mej = p.mejorasDe(k);
      cuerpo = `<div class="lista">` + Object.entries(MEJORAS).map(([clave, m]) => {
        const nivel = mej[clave] || 0;
        const costo = costoMejora(clave, nivel);
        return `<div class="fila">
          <div class="crece">
            <div class="t">${m.nombre} <span class="num">${'▮'.repeat(nivel)}${'▯'.repeat(m.max - nivel)}</span></div>
            <div class="d">${m.desc}${costo === null ? ' · al máximo' : ' · ' + plata(costo)}</div>
          </div>
          <button data-accion="mejorar" data-valor="${k}" data-extra="${clave}"
            ${costo !== null && p.plata >= costo ? '' : 'disabled'}>Mejorar</button>
        </div>`;
      }).join('') + `</div>
        <div class="cerrar">Índice actual del ${AUTOS[k].nombre}: <b>${indice(spec)}</b> (de fábrica ${indice(AUTOS[k])})</div>`;
    }

    this.el.innerHTML = `<div class="caja">
      <h2>TRAZADA</h2>
      <div class="sub">Campeonato · nivel ${p.nivel}</div>
      <div class="barra">
        <div class="chip">Plata <b>${plata(p.plata)}</b></div>
        <div class="chip">Nivel <b>${p.nivel}</b> · ${xn.hecho}/${xn.falta} xp</div>
        <div class="chip">Puntos <b>${p.puntos.toLocaleString('es-AR')}</b></div>
        <div class="chip">Auto <b>${AUTOS[p.actual].nombre}</b></div>
        <div class="chip">Carreras <b>${p.carreras.ganadas}</b>/${p.carreras.corridas}</div>
      </div>
      <div class="tabs">${tabs.map(([id, t]) =>
        `<button class="${this.tab === id ? 'on' : ''}" data-accion="tab" data-valor="${id}">${t}</button>`).join('')}
        <button data-accion="cerrar" style="margin-left:auto">Cerrar (Tab)</button>
      </div>
      ${cuerpo}
    </div>`;
  }
}

// ===== main.js =====
// La física corre a paso FIJO de 400 Hz, desacoplada del dibujo: a 60 Hz el
// volante se siente gomoso y el neumático pierde el pico de agarre.
const HZ = 400, DT = 1 / HZ;

class Juego {
  async init() {
    const paso = (t) => new Promise(r => {
      document.getElementById('carga').textContent = t;
      requestAnimationFrame(() => requestAnimationFrame(r));
    });

    await paso('Abriendo el garage…');
    this.progreso = new Progreso();

    this.renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    this.renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
    this.renderer.setSize(innerWidth, innerHeight);
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = 1.15;
    document.body.appendChild(this.renderer.domElement);

    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x8fb6d9);
    this.scene.fog = new THREE.Fog(0x8fb6d9, 340, 1600);
    this.camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.3, 3000);
    this.scene.add(new THREE.HemisphereLight(0xbdd6f5, 0x4a5240, 1.15));
    const sol = new THREE.DirectionalLight(0xfff2d8, 1.9);
    sol.position.set(220, 340, 140); this.scene.add(sol);
    this.mallaPista = null;
    // Se crea antes de rearmarAuto(): colocarEnGrilla lo usa.
    this.camPos = new THREE.Vector3();
    this.sActual = 0; this.acumulado = 0; this.choque = 0;

    await paso('Trazando el circuito…');
    this.pista = 7;
    this.cargarPista(7);

    await paso('Bajando el auto del camión…');
    this.auto = null; this.mallaAuto = null;
    this.rearmarAuto();

    this.wheel = new Wheel();
    this.hud = new Hud();
    this.menu = new Menu(this);
    this.carrera = new Carrera(this.circuito, this.scene);
    this.puntaje = new Puntaje();
    this.aviso = ''; this.avisoT = 0;
    this.modo = 'practica';

    addEventListener('resize', () => this.onResize());
    addEventListener('keydown', (e) => {
      if (e.code === 'Tab') { e.preventDefault(); this.alternarMenu(); }
      if (e.code === 'KeyR') this.volverAPista();
      if (e.code === 'KeyC') this.calibrar();
      if (e.code === 'Escape' && this.carrera.estado !== 'libre') this.terminarCarrera(true);
    });

    document.getElementById('splash').classList.add('listo');
    this.menu.abrir(true);
    this.last = performance.now();
    requestAnimationFrame(this.loop.bind(this));
  }

  decir(t, s = 2.5) { this.aviso = t; this.avisoT = s; }

  specActual() {
    const k = this.progreso.actual;
    return aplicarMejoras(AUTOS[k], this.progreso.mejorasDe(k));
  }

  cargarPista(semilla) {
    if (this.mallaPista) { this.scene.remove(this.mallaPista); }
    this.pista = semilla;
    this.circuito = generarCircuito(semilla);
    this.mallaPista = construirCircuito(this.circuito, this.scene);
    this.timing = new Timing(this.circuito, semilla);
    if (this.carrera) this.carrera.c = this.circuito;
    this.hud && (this.hud._lim = null);
  }

  // Rearma el auto del jugador con el modelo y las mejoras actuales.
  rearmarAuto() {
    const spec = this.specActual();
    const x = this.auto ? this.auto.x : 0, z = this.auto ? this.auto.z : 0, yaw = this.auto ? this.auto.yaw : 0;
    this.auto = new Vehicle(spec, x, z, yaw);
    if (this.mallaAuto) this.scene.remove(this.mallaAuto);
    this.mallaAuto = construirAuto(AUTOS[this.progreso.actual].color);
    this.scene.add(this.mallaAuto);
    this.ruedas = this.mallaAuto.userData.ruedas;
    if (this.circuito) this.colocarEnGrilla();
  }

  alternarMenu() {
    const abrir = !this.menu.abierto;
    this.menu.abrir(abrir);
    if (abrir && this.carrera.corriendo) this.decir('La carrera sigue corriendo', 2);
  }

  colocarEnGrilla(s = null, carril = 0) {
    const m = this.circuito.linea.en(s == null ? this.circuito.largo - 26 : s);
    this.auto.x = m.x + m.nx * carril; this.auto.z = m.z + m.nz * carril;
    this.auto.yaw = Math.atan2(m.tx, m.tz);
    this.auto.u = 0; this.auto.v = 0; this.auto.r = 0;
    this.auto.marcha = 1;
    for (const k in this.auto.w) this.auto.w[k] = 0;
    this.sActual = ((this.circuito.largo + (s == null ? -26 : s)) % this.circuito.largo);
    this.camPos.set(0, 0, 0);
  }

  volverAPista() {
    const m = this.circuito.linea.en(this.sActual);
    this.auto.x = m.x; this.auto.z = m.z;
    this.auto.yaw = Math.atan2(m.tx, m.tz);
    this.auto.u = Math.min(this.auto.u, 14); this.auto.v = 0; this.auto.r = 0;
    this.auto.zs = this.auto.pitch = this.auto.roll = 0;
    this.auto.dzs = this.auto.dpitch = this.auto.droll = 0;
    for (const k in this.auto.w) this.auto.w[k] = this.auto.u / this.auto.s.rueda;
    this.timing.valida = false;
    this.puntaje.romper('Volviste a pista');
    this.decir('De vuelta en pista (vuelta invalidada)', 2);
  }

  practicar(id) {
    const ev = EVENTOS.find(e => e.id === id);
    this.carrera.abandonar();
    this.modo = 'practica';
    if (ev.pista !== this.pista) this.cargarPista(ev.pista);
    this.colocarEnGrilla();
    this.decir(`Práctica libre · ${ev.nombre}`, 3);
  }

  empezarCarrera(id) {
    const ev = EVENTOS.find(e => e.id === id);
    if (ev.pista !== this.pista) this.cargarPista(ev.pista);
    this.modo = 'carrera';
    this.evento = ev;
    const g = this.carrera.preparar(ev, this.specActual());
    this.colocarEnGrilla(g.s, g.carril);
    this.puntaje = new Puntaje();
    this.progreso.carreras.corridas++;
    this.decir(`${ev.nombre} · ${ev.vueltas} vueltas`, 3);
  }

  terminarCarrera(abandono) {
    if (abandono) this.decir('Abandonaste la carrera', 3);
    this.carrera.abandonar();
    this.modo = 'practica';
  }

  onResize() {
    this.camera.aspect = innerWidth / innerHeight;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(innerWidth, innerHeight);
  }

  calibrar() {
    if (this.wheel.calibrando) return;
    this.wheel.empezarCalibracion();
    this.decir('CALIBRANDO: girá el volante de tope a tope y pisá los tres pedales', 6);
    setTimeout(() => {
      const ejes = this.wheel.terminarCalibracion();
      this.decir(ejes && ejes.length
        ? `Calibrado: ${ejes.length} ejes reconocidos`
        : 'No se movió ningún eje. ¿Está conectado el volante?', 5);
    }, 6000);
  }

  fisica(dt) {
    const a = this.auto;
    const largando = this.carrera.largando;
    const e = this.wheel.estado(a.kmh);
    // La convención interna es que volante positivo dobla a la izquierda.
    a.mandos.volante = -e.volante;
    a.mandos.acelerador = largando ? 0 : e.acelerador;
    a.mandos.freno = largando ? 1 : e.freno;
    a.mandos.mano = e.mano;

    const p = this.circuito.linea.proyectar(a.x, a.z, this.sActual);
    this.sActual = ((p.s % this.circuito.largo) + this.circuito.largo) % this.circuito.largo;
    const sup = superficie(this.circuito, p.lateral, this.sActual);
    this.superficie = sup;
    const base = this.specActual();
    a.s = { ...base, mu: base.mu * sup.mu };

    a.paso(dt);
    this.enPista = sup.tipo === 'asfalto' || sup.tipo === 'piano';
    this.timing.update(dt, this.sActual, this.enPista);

    const r = this.carrera.update(dt, this.sActual);
    if (r) this.cerrarResultado(r);

    // Choques contra los rivales: te empujan y te cortan la cadena.
    this.choque = Math.max(0, this.choque - dt * 8);
    for (const riv of this.carrera.rivales) {
      const dx = a.x - riv.x, dz = a.z - riv.z;
      const d = Math.hypot(dx, dz);
      if (d < 3.4 && d > 0.01) {
        const nx = dx / d, nz = dz / d, pen = 3.4 - d;
        a.x += nx * pen * 0.8; a.z += nz * pen * 0.8;
        const vn = a.u * 0.2;
        a.v += nx * 2.4; a.u *= 0.985;
        this.choque = Math.max(this.choque, Math.abs(vn) * 0.6 + 3);
        riv.v *= 0.985;
      }
    }
  }

  cerrarResultado(r) {
    this.puntaje.cobrar();
    this.progreso.sumarPuntos(this.puntaje.banco);
    const bonoPuntos = Math.round(this.puntaje.banco / 12);
    this.progreso.premiar(r.plata + bonoPuntos, r.xp);
    if (r.puesto === 1) this.progreso.carreras.ganadas++;
    this.progreso.guardar();
    this.resultado = { ...r, puntos: this.puntaje.banco, bonoPuntos };
    this.decir(`${r.puesto}º de ${r.total} · ${reloj(r.tiempo)} · +${(r.plata + bonoPuntos).toLocaleString('es-AR')}`, 8);
    setTimeout(() => { this.terminarCarrera(false); this.menu.abrir(true); }, 5200);
  }

  update(dtReal) {
    if (this.wheel.calibrando) this.wheel.pasoCalibracion(dtReal);
    this.avisoT = Math.max(0, this.avisoT - dtReal);

    if (!this.menu.abierto) {
      this.acumulado += Math.min(dtReal, 0.25);
      let pasos = 0;
      while (this.acumulado >= DT && pasos < 240) {
        const antes = this.timing.vuelta;
        this.fisica(DT);
        if (this.timing.vuelta > antes && this.timing.ultima != null) {
          const v = this.timing.vueltas[this.timing.vueltas.length - 1];
          if (v.valida && this.progreso.registrarVuelta(this.pista, v.t))
            this.decir(`RÉCORD · ${reloj(v.t)}`, 3);
          else if (v.valida) this.decir(`Vuelta ${reloj(v.t)}`, 2.5);
          else this.decir(`Vuelta inválida (${reloj(v.t)})`, 2.5);
        }
        this.acumulado -= DT;
        pasos++;
      }
      this.puntaje.update(dtReal, {
        auto: this.auto, enPista: this.enPista !== false,
        rivales: this.carrera.rivales, choque: this.choque,
      });
    }

    const a = this.auto;
    this.mallaAuto.position.set(a.x, -a.zs * 0.6, a.z);
    this.mallaAuto.rotation.set(a.pitch * 0.55, a.yaw, -a.roll * 0.85, 'YXZ');
    for (const k in this.ruedas) {
      const w = this.ruedas[k];
      w.rotation.x = a.w[k] * 0.35;
      w.rotation.y = k[0] === 'D' ? a.mandos.volante * a.s.volanteMax : 0;
    }

    this.camara(dtReal);
    this.hud.update(this);
  }

  camara(dt) {
    const a = this.auto, f = a.adelante();
    const vel = clamp(a.velocidad / 60, 0, 1);
    const dist = lerp(8.2, 11.4, vel), alto = lerp(3.3, 4.0, vel);
    const obj = new THREE.Vector3(a.x - f.x * dist, alto, a.z - f.z * dist);
    if (this.camPos.lengthSq() === 0) this.camPos.copy(obj);
    this.camPos.lerp(obj, Math.min(1, dt * 7));
    this.camera.position.copy(this.camPos);
    this.camera.lookAt(a.x + f.x * 9, 0.9, a.z + f.z * 9);
    const fov = lerp(60, 76, vel);
    if (Math.abs(this.camera.fov - fov) > 0.15) { this.camera.fov = fov; this.camera.updateProjectionMatrix(); }
  }

  loop(now) {
    requestAnimationFrame(this.loop.bind(this));
    let dt = (now - this.last) / 1000;
    this.last = now;
    if (dt <= 0) return;
    this.update(Math.min(dt, 0.1));
    this.renderer.render(this.scene, this.camera);
  }
}

const juego = new Juego();
window.juego = juego;
juego.init().catch(e => {
  document.getElementById('carga').textContent = 'Se rompió: ' + e.message;
  console.error(e);
});

{
  const foco = document.getElementById('foco');
  const arrancar = () => { window.focus(); foco.classList.add('oculto'); };
  foco.addEventListener('click', arrancar);
  addEventListener('keydown', () => foco.classList.add('oculto'), { once: true });
  const esperar = setInterval(() => {
    if (window.juego && window.juego.auto) { clearInterval(esperar); foco.classList.remove('oculto'); }
  }, 250);
}
